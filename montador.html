<html lang="es">
<head>

<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.6.1/dist/js/tabulator.min.js"></script>
<style>
:root{--primary:#2563eb;--bg:#f5f6fa;--card:#fff;--border:#e2e4eb;--text:#1f2430;--muted:#6b7280;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
#menubar{background:#1f2430;color:#e5e7eb;display:flex;align-items:center;padding:0 12px;font-size:13px;position:relative;z-index:20;}
#menubar .brand{font-weight:700;color:#fff;padding:10px 16px 10px 0;font-size:15px;}
.menu-item{position:relative;}
.menu-item > span{display:block;padding:10px 14px;cursor:pointer;}
.menu-item:hover > span, .menu-item.abierto > span{background:#374151;}
.menu-drop{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--text);min-width:220px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);border-radius:0 0 8px 8px;overflow:hidden;}
.menu-item.abierto .menu-drop{display:block;}
.menu-drop a{display:block;padding:10px 16px;color:var(--text);text-decoration:none;font-size:13px;border-bottom:1px solid var(--border);}
.menu-drop a:hover{background:var(--bg);}
#toolbar{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
#toolbar .spacer{flex:1;}
button{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;}
button:hover{opacity:.9;}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
button:disabled{opacity:.6;cursor:default;}
input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;}
.tabla-scroll{margin:0 24px 24px;overflow-x:auto;}
.estado-pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;display:inline-block;}
.estado-en_proceso{background:#eef2ff;color:#4338ca;}
.estado-recepcionado_parcial{background:#fef9c3;color:#a16207;}
.estado-recepcionado_total{background:#ecfeff;color:#0e7490;}
.estado-agendado{background:#f5f3ff;color:#6d28d9;}
.estado-completado{background:#f0fdf4;color:#15803d;}
.estado-incidencia{background:#fef2f2;color:#dc2626;}
#panel_detalle{display:none;position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(480px,100vw);background:var(--card);border-left:1px solid var(--border);box-shadow:-10px 0 30px -20px rgba(0,0,0,.3);padding:24px;overflow-y:auto;}
#panel_detalle h3{margin-top:0;}
#panel_detalle h4{margin:22px 0 8px;font-size:14px;border-top:1px solid var(--border);padding-top:16px;}
#panel_detalle .campo{margin-bottom:14px;}
#panel_detalle label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
#panel_detalle select,#panel_detalle textarea,#panel_detalle input{width:100%;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:35;}
.filtros-montajes{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:14px 24px 0;}
.filtros-montajes label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;}
.filtros-montajes input{min-width:170px;}
.badge{display:inline-block;margin-left:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;}
.badge-fotos{background:#e0f2fe;color:#0369a1;}
.badge-firmado{background:#dcfce7;color:#15803d;}
.lineas-table{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px;}
.lineas-table th,.lineas-table td{border-bottom:1px solid var(--border);padding:6px 4px;text-align:left;}
.pill-recibida{background:#f0fdf4;color:#15803d;padding:2px 8px;border-radius:999px;font-size:11px;}
.pill-pendiente{background:#fef9c3;color:#a16207;padding:2px 8px;border-radius:999px;font-size:11px;}
.mini-list{font-size:13px;}
.mini-list .item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
.mini-list .item .meta{color:var(--muted);font-size:11px;margin-top:2px;}
.mini-list .item a{color:var(--primary);}
.btn-mini{padding:4px 8px;font-size:12px;border-radius:5px;}
canvas#firma_canvas{border:1px solid var(--border);border-radius:8px;width:100%;height:160px;touch-action:none;background:#fafbfe;}
.aviso-ok{display:none;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px;}
.error{display:none;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px;}
#toolbar button:not([onclick="logout()"]){background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd;font-weight:600;}
#toolbar button:not([onclick="logout()"]):hover{background:#bfdbfe;opacity:1;}
#toolbar button.activo,#toolbar button.activo:hover{background:#1e40af;color:#fff;border:1px solid #1e3a8a;box-shadow:0 2px 6px rgba(30,64,175,.4);}
#menubar .menu-item > span{background:#dbeafe;color:#1e3a8a;font-weight:600;margin:5px 3px;padding:6px 14px;border-radius:6px;border:1px solid #93c5fd;}
#menubar .menu-item:hover > span,#menubar .menu-item.abierto > span{background:#bfdbfe;}
#menubar .menu-item.activo-menu > span{background:#1e40af;color:#fff;border-color:#1e3a8a;box-shadow:0 2px 6px rgba(30,64,175,.4);}
.menu-drop a{background:#eff6ff;color:#1e3a8a;}
.menu-drop a:hover{background:#dbeafe;}
.menu-drop a.activo-link{background:#1e40af;color:#fff;font-weight:600;}
/* --- listados con el formato de las líneas de la orden: cabecera azul, filas alternas y banda de color a la izquierda --- */
.tabulator{border:1px solid #bfdbfe;border-radius:8px;}
.tabulator .tabulator-header{background:#dbeafe;border-bottom:2px solid #93c5fd;color:#1e3a8a;}
.tabulator .tabulator-header .tabulator-col{background:#dbeafe;border-right:1px solid #bfdbfe;}
.tabulator .tabulator-header .tabulator-col .tabulator-col-content{padding:9px 8px;}
.tabulator .tabulator-header .tabulator-col .tabulator-col-title{font-weight:700;}
.tabulator .tabulator-row{border-bottom:1px solid #dbeafe;}
.tabulator .tabulator-row.tabulator-row-even{background:#f5f9ff;}
.tabulator .tabulator-row:hover{background:#e0efff;}
.tabulator .tabulator-row .tabulator-cell{padding:9px 8px;border-right:1px solid #eaf2ff;}
.tabulator .tabulator-row .tabulator-cell:first-child{border-left:5px solid #94a3b8;}
.tabulator .tabulator-row.est-en_proceso .tabulator-cell:first-child{border-left-color:#6366f1;}
.tabulator .tabulator-row.est-recepcionado_parcial .tabulator-cell:first-child{border-left-color:#ca8a04;}
.tabulator .tabulator-row.est-recepcionado_total .tabulator-cell:first-child{border-left-color:#0891b2;}
.tabulator .tabulator-row.est-agendado .tabulator-cell:first-child{border-left-color:#7c3aed;}
.tabulator .tabulator-row.est-completado .tabulator-cell:first-child{border-left-color:#16a34a;}
.tabulator .tabulator-row.est-incidencia .tabulator-cell:first-child{border-left-color:#dc2626;}
.tabulator .tabulator-row.est-terminado_incidencia .tabulator-cell:first-child{border-left-color:#9a3412;}
.tabulator .tabulator-row.rec-si .tabulator-cell:first-child,.tabulator .tabulator-row.ent-exacta .tabulator-cell:first-child{border-left-color:#16a34a;}
.tabulator .tabulator-row.rec-no .tabulator-cell:first-child{border-left-color:#d97706;background:#fffbeb;}
.tabulator .tabulator-row.ent-deducida .tabulator-cell:first-child{border-left-color:#94a3b8;}
.leyenda-listado{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:#6b7280;padding:6px 24px 8px;}
.leyenda-listado span{border-left:5px solid var(--c,#94a3b8);padding-left:6px;}
.mini-list .item{border-left:5px solid #2563eb;background:#f9fbff;border-color:#bfdbfe;border-left-color:#2563eb;}
.estado-terminado_incidencia{background:#fff7ed;color:#9a3412;}
.item-pendiente{border-left:5px solid #d97706 !important;background:#fffbeb !important;}
.linea-recibida{border-left:5px solid #16a34a !important;background:#f6fef9 !important;}
</style>
</head>

<script>
const client = supabase.createClient(
  "https://uamgbtbsxbrgymhqalak.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWdidGJzeGJyZ3ltaHFhbGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTMyOTIsImV4cCI6MjA5OTg4OTI5Mn0.0OClM8yZmfkiXynOkGLQiLRX-XZjkkP63z5UfIgck8k"
);

let tabla = null;
let pedidoActivo = null;
let montadorUserId = null;

document.querySelectorAll(".menu-item").forEach(item => {
  item.querySelector("span").addEventListener("click", (e) => {
    e.stopPropagation();
    const yaAbierto = item.classList.contains("abierto");
    document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("abierto"));
    if (!yaAbierto) item.classList.add("abierto");
  });
});
document.addEventListener("click", () => document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("abierto")));

function proximamente(nombre) {
  alert(`"${nombre}" todavía no está construido en la app nueva — próximamente.`);
}

async function comprobarSesion() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) { window.location.href = "login.html"; return; }
  const { data: staffRow } = await client.from("staff").select("user_id, es_montador, solo_deca").eq("user_id", user.id).maybeSingle();
  if (!staffRow || staffRow.solo_deca) { window.location.href = staffRow?.solo_deca ? "deca.html" : "pedidos.html"; return; }
  if (!staffRow.es_montador) { window.location.href = "pedidos.html"; return; }
  montadorUserId = staffRow.user_id;
  cargarMontajes();
}

async function logout() {
  await client.auth.signOut();
  window.location.href = "login.html";
}

let debounceClienteMontajes = null;
function filtrarClienteDebounce() { clearTimeout(debounceClienteMontajes); debounceClienteMontajes = setTimeout(cargarMontajes, 300); }
function limpiarFiltrosMontajes() {
  ["f_prev_desde", "f_prev_hasta", "f_cliente", "f_real_desde", "f_real_hasta"].forEach(id => { document.getElementById(id).value = ""; });
  cargarMontajes();
}

async function cargarMontajes() {
  // Esta persona (montador) y las órdenes en las que va asignada. La base de datos ya solo
  // le deja ver las suyas; el filtro "mio" hace lo mismo para el administrador que también monta.
  const { data: yo, error: errYo } = await client.from("montadores").select("id").eq("staff_user_id", montadorUserId).maybeSingle();
  if (errYo || !yo) {
    document.getElementById("tabla_montajes").innerHTML = '<p style="padding:20px;">Tu usuario todavía no está enlazado con ninguna persona de la lista de montadores. Avisa al administrador.</p>';
    return;
  }
  // filtros: rango de fechas del montaje previsto, nombre del cliente y rango de fechas en que se hizo (la firma)
  const fPrevDesde = document.getElementById("f_prev_desde").value;
  const fPrevHasta = document.getElementById("f_prev_hasta").value;
  const fCliente = document.getElementById("f_cliente").value.trim();
  const fRealDesde = document.getElementById("f_real_desde").value;
  const fRealHasta = document.getElementById("f_real_hasta").value;
  const hayRealizado = !!(fRealDesde || fRealHasta);
  const embedFirmas = hayRealizado ? "firmas:entregas!inner(firmado_at)" : "firmas:entregas(firmado_at)";
  const trozos = (s) => s.split("-").map(Number);
  const diaTexto = (f) => `${f.getFullYear()}-${String(f.getMonth() + 1).padStart(2, "0")}-${String(f.getDate()).padStart(2, "0")}`;
  let consulta = client.from("ordenes")
    .select("anyo, orden, nombre_cli, domicilio_cli, localidad_cli, telefono_cli, estado, fecha_prev_montaje, horamont, mio:ordenes_montadores!inner(montador_id), equipo:ordenes_montadores(montadores(nombre)), fotos:fotos_orden(id), " + embedFirmas)
    .eq("mio.montador_id", yo.id);
  // los rangos incluyen el día "hasta" entero
  if (fPrevDesde) consulta = consulta.gte("fecha_prev_montaje", fPrevDesde);
  if (fPrevHasta) { const [a, m, d] = trozos(fPrevHasta); consulta = consulta.lt("fecha_prev_montaje", diaTexto(new Date(a, m - 1, d + 1))); }
  if (fCliente) consulta = consulta.ilike("nombre_cli", `%${fCliente}%`);
  if (fRealDesde) { const [a, m, d] = trozos(fRealDesde); consulta = consulta.gte("firmas.firmado_at", new Date(a, m - 1, d).toISOString()); }
  if (fRealHasta) { const [a, m, d] = trozos(fRealHasta); consulta = consulta.lt("firmas.firmado_at", new Date(a, m - 1, d + 1).toISOString()); }
  const { data: crudos, error } = await consulta
    .order("anyo", { ascending: false })
    .order("orden", { ascending: false })
    .limit(200);
  if (error) { console.error(error); return; }
  const fmtFecha = (v) => v ? v.slice(8, 10) + "/" + v.slice(5, 7) + "/" + v.slice(0, 4) : "";
  const data = (crudos || []).map(o => {
    const firmas = (o.firmas || []).map(f => f.firmado_at).filter(Boolean).sort();
    const ultimaFirma = firmas.length ? firmas[firmas.length - 1] : null;
    return {
      ...o,
      equipo_txt: (o.equipo || []).map(e => e.montadores?.nombre).filter(Boolean).join(" + "),
      propuesta_txt: [fmtFecha(o.fecha_prev_montaje), (o.horamont && o.horamont !== "M") ? o.horamont : ""].filter(Boolean).join(" "),
      num_fotos: (o.fotos || []).length,
      firmado_at: ultimaFirma,
      realizada_txt: ultimaFirma ? new Date(ultimaFirma).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" }) : "",
    };
  });

  const columnas = [
    { title: "Año", field: "anyo", width: 70 },
    { title: "Pedido", field: "orden", width: 90 },
    { title: "Cliente", field: "nombre_cli" },
    { title: "Equipo", field: "equipo_txt" },
    // se ordenan por la fecha completa (año-mes-día), no por el texto "dd/mm/aaaa", que ordenaría por día
    { title: "Fecha y hora propuesta", field: "fecha_prev_montaje", width: 170, sorter: "string", sorterParams: { alignEmptyValues: "bottom" },
      formatter: (cell) => cell.getRow().getData().propuesta_txt },
    { title: "Fecha y hora realizada", field: "firmado_at", width: 170, sorter: "string", sorterParams: { alignEmptyValues: "bottom" },
      formatter: (cell) => cell.getRow().getData().realizada_txt },
    { title: "Dirección", field: "domicilio_cli" },
    { title: "Localidad", field: "localidad_cli" },
    { title: "Estado", field: "estado", formatter: (cell) => {
        const v = cell.getValue() || "en_proceso";
        const d = cell.getRow().getData();
        return `<span class="estado-pill estado-${v}">${v.replace(/_/g, " ")}</span>` +
          (d.num_fotos ? `<span class="badge badge-fotos">${d.num_fotos} ${d.num_fotos === 1 ? "foto" : "fotos"}</span>` : "") +
          (d.firmado_at ? `<span class="badge badge-firmado">FIRMADO</span>` : "");
      } },
  ];

  const hayFiltros = !!(fPrevDesde || fPrevHasta || fCliente || hayRealizado);
  document.getElementById("aviso_montajes").textContent = `${data.length} montajes` +
    (data.length >= 200 ? " (los 200 más recientes: usa los filtros para encontrar otros)" : "") + (hayFiltros ? " con los filtros aplicados." : ".");

  if (!tabla) {
    tabla = new Tabulator("#tabla_montajes", {
      data, columns: columnas, layout: "fitColumns", height: "calc(100vh - 110px)", rowFormatter: (row) => { row.getElement().classList.add("est-" + (row.getData().estado || "en_proceso")); },
    });
    // no usamos la opcion rowClick de Tabulator: bloquea el callback si detecta
    // cualquier seleccion de texto activa en la pagina (falso positivo frecuente
    // en Safari/trackpad de Mac), dejando el click sin efecto. Escuchamos el click
    // directamente sobre el contenedor para evitar ese bloqueo.
    document.getElementById("tabla_montajes").addEventListener("click", (e) => {
      const rowEl = e.target.closest(".tabulator-row");
      if (!rowEl) return;
      const row = tabla.getRows().find(r => r.getElement() === rowEl);
      if (row) abrirPanel(row.getData());
    });
  } else {
    tabla.setData(data);
  }
}

async function abrirPanel(orden) {
  pedidoActivo = { anyo: orden.anyo, orden: orden.orden };
  document.getElementById("aviso").style.display = "none";
  document.getElementById("error").style.display = "none";
  document.getElementById("d_titulo").textContent = `Pedido ${orden.anyo}/${orden.orden}`;
  document.getElementById("d_estado_txt").innerHTML = `<span class="estado-pill estado-${orden.estado || "en_proceso"}">${(orden.estado || "en_proceso").replace(/_/g, " ")}</span>`;
  document.getElementById("d_propuesta").textContent = orden.propuesta_txt || "-";
  document.getElementById("d_realizada").textContent = orden.realizada_txt || "-";
  document.getElementById("d_cliente").textContent = orden.nombre_cli || "-";
  const direccionTexto = [orden.domicilio_cli, orden.localidad_cli].filter(Boolean).join(", ");
  document.getElementById("d_direccion").textContent = direccionTexto || "-";
  const enlaceMaps = document.getElementById("d_direccion_maps");
  if (direccionTexto) {
    enlaceMaps.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(direccionTexto)}`;
    enlaceMaps.style.display = "inline-block";
  } else {
    enlaceMaps.style.display = "none";
  }
  document.getElementById("d_telefono").textContent = orden.telefono_cli || "-";
  document.getElementById("firma_nombre").value = orden.nombre_cli || "";

  await cargarLineas();
  await cargarFotos();
  await cargarEntregaPrevia();
  limpiarFirma();

  document.getElementById("panel_detalle").style.display = "block";
  document.getElementById("panel_detalle").scrollTop = 0;
  document.getElementById("overlay").style.display = "block";
}

function cerrarPanel() {
  document.getElementById("panel_detalle").style.display = "none";
  document.getElementById("overlay").style.display = "none";
  pedidoActivo = null;
  cargarMontajes();   // al cerrar se refresca la lista: así salen las fotos y la firma recién hechas
}

async function cargarLineas() {
  const { data: lineas } = await client.from("linorden")
    .select("linea, articulo, descripcion, cantidad, recibido_at")
    .eq("anyo", pedidoActivo.anyo).eq("orden", pedidoActivo.orden).order("linea");

  const tbody = document.getElementById("tabla_lineas");
  tbody.innerHTML = "<tr><th>Artículo</th><th>Cant.</th><th></th></tr>" +
    (lineas || []).map(l => {
      const pill = l.recibido_at
        ? '<span class="pill-recibida">recibido</span>'
        : '<span class="pill-pendiente">pendiente</span>';
      return `<tr><td>${l.descripcion || l.articulo || ""}</td><td>${l.cantidad ?? ""}</td><td>${pill}</td></tr>`;
    }).join("");
}

async function cargarFotos() {
  const { data } = await client.from("fotos_orden")
    .select("id, storage_path, categoria, comentario, created_at")
    .eq("anyo", pedidoActivo.anyo).eq("orden", pedidoActivo.orden)
    .order("created_at", { ascending: false });

  const cont = document.getElementById("lista_fotos");
  cont.innerHTML = (data || []).map(f => `
    <div class="item">
      <strong>${f.categoria || "foto"}</strong> ${f.comentario ? "— " + f.comentario : ""}
      <div class="meta">${new Date(f.created_at).toLocaleString("es-ES")} — <a href="#" onclick="verFoto('${f.storage_path}');return false;">ver</a></div>
    </div>`).join("") || '<div class="meta">Sin fotos todavía.</div>';
}

async function verFoto(path) {
  const { data, error } = await client.storage.from("ordenes-adjuntos").createSignedUrl(path, 300);
  if (error) { alert("No se pudo abrir la foto: " + error.message); return; }
  window.open(data.signedUrl, "_blank");
}

async function subirFoto() {
  const errorBox = document.getElementById("error");
  errorBox.style.display = "none";
  const input = document.getElementById("foto_archivo");
  const archivo = input.files[0];
  if (!archivo) { errorBox.textContent = "Elige una foto primero."; errorBox.style.display = "block"; return; }

  const categoria = document.getElementById("foto_categoria").value;
  const comentario = document.getElementById("foto_comentario").value.trim();
  const ext = (archivo.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${pedidoActivo.anyo}/${pedidoActivo.orden}/fotos/${Date.now()}.${ext}`;

  const { error: errSubida } = await client.storage.from("ordenes-adjuntos").upload(path, archivo);
  if (errSubida) { errorBox.textContent = "No se pudo subir la foto: " + errSubida.message; errorBox.style.display = "block"; return; }

  const { error: errFila } = await client.from("fotos_orden").insert({
    anyo: pedidoActivo.anyo, orden: pedidoActivo.orden,
    storage_path: path, categoria, comentario: comentario || null,
    subida_por: montadorUserId,
  });
  if (errFila) { errorBox.textContent = "Foto subida, pero no se pudo guardar el registro: " + errFila.message; errorBox.style.display = "block"; return; }

  input.value = "";
  document.getElementById("foto_comentario").value = "";
  await cargarFotos();
}

// --- firma ---
let dibujando = false;
let ultimoPunto = null;

function coordsCanvas(e) {
  const canvas = document.getElementById("firma_canvas");
  const rect = canvas.getBoundingClientRect();
  const escalaX = canvas.width / rect.width;
  const escalaY = canvas.height / rect.height;
  const punto = e.touches ? e.touches[0] : e;
  return { x: (punto.clientX - rect.left) * escalaX, y: (punto.clientY - rect.top) * escalaY };
}

function iniciarTrazo(e) {
  e.preventDefault();
  dibujando = true;
  ultimoPunto = coordsCanvas(e);
}

function trazar(e) {
  if (!dibujando) return;
  e.preventDefault();
  const canvas = document.getElementById("firma_canvas");
  const ctx = canvas.getContext("2d");
  const punto = coordsCanvas(e);
  ctx.strokeStyle = "#1f2430";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(ultimoPunto.x, ultimoPunto.y);
  ctx.lineTo(punto.x, punto.y);
  ctx.stroke();
  ultimoPunto = punto;
}

function terminarTrazo() { dibujando = false; }

function limpiarFirma() {
  const canvas = document.getElementById("firma_canvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function firmaVacia() {
  const canvas = document.getElementById("firma_canvas");
  const ctx = canvas.getContext("2d");
  const datos = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < datos.length; i += 4) if (datos[i] !== 0) return false;
  return true;
}

let entregaActivaId = null;

async function cargarEntregaPrevia() {
  const { data } = await client.from("entregas")
    .select("id, firmante_nombre, firmado_at, firma_storage_path")
    .eq("anyo", pedidoActivo.anyo).eq("orden", pedidoActivo.orden)
    .order("firmado_at", { ascending: false }).limit(1).maybeSingle();

  const cont = document.getElementById("entrega_previa");
  entregaActivaId = data ? data.id : null;

  if (!data) {
    cont.innerHTML = "";
    document.getElementById("entrega_previa_botones").style.display = "none";
    document.getElementById("seccion_firmar").style.display = "block";
    return;
  }

  cont.innerHTML = `<div class="item">Ya firmado por <strong>${data.firmante_nombre || "-"}</strong> el ${new Date(data.firmado_at).toLocaleString("es-ES")}</div>`;

  if (data.firma_storage_path) {
    const { data: signed } = await client.storage.from("ordenes-adjuntos").createSignedUrl(data.firma_storage_path, 300);
    if (signed) cont.innerHTML += `<img src="${signed.signedUrl}" alt="Firma" style="max-width:100%;border:1px solid var(--border);border-radius:8px;margin-top:6px;">`;
  }

  document.getElementById("entrega_previa_botones").style.display = "block";
  document.getElementById("seccion_firmar").style.display = "none";
}

function rehacerFirma() {
  document.getElementById("seccion_firmar").style.display = "block";
  document.getElementById("entrega_previa_botones").style.display = "none";
  limpiarFirma();
}

async function borrarFirma() {
  if (!entregaActivaId) return;
  if (!confirm("¿Eliminar la firma registrada? El montador podrá volver a firmar.")) return;
  const { error } = await client.from("entregas").delete().eq("id", entregaActivaId);
  if (error) { alert("No se pudo eliminar: " + error.message); return; }
  await cargarEntregaPrevia();
}

async function confirmarEntrega() {
  const errorBox = document.getElementById("error");
  const avisoBox = document.getElementById("aviso");
  errorBox.style.display = "none";
  avisoBox.style.display = "none";

  const firmante_nombre = document.getElementById("firma_nombre").value.trim();
  if (!firmante_nombre) { errorBox.textContent = "Falta el nombre de quien firma."; errorBox.style.display = "block"; return; }
  if (firmaVacia()) { errorBox.textContent = "Falta capturar la firma."; errorBox.style.display = "block"; return; }

  const canvas = document.getElementById("firma_canvas");
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  const path = `${pedidoActivo.anyo}/${pedidoActivo.orden}/firma/${Date.now()}.png`;

  const { error: errSubida } = await client.storage.from("ordenes-adjuntos").upload(path, blob, { contentType: "image/png" });
  if (errSubida) { errorBox.textContent = "No se pudo guardar la firma: " + errSubida.message; errorBox.style.display = "block"; return; }

  const observaciones = document.getElementById("entrega_observaciones").value.trim();
  const { error: errEntrega } = await client.from("entregas").insert({
    anyo: pedidoActivo.anyo, orden: pedidoActivo.orden,
    firmante_nombre, firma_storage_path: path,
    observaciones: observaciones || null, montador_id: montadorUserId,
  });
  if (errEntrega) { errorBox.textContent = "No se pudo registrar la entrega: " + errEntrega.message; errorBox.style.display = "block"; return; }

  avisoBox.textContent = "Entrega confirmada. Pedido marcado como completado.";
  avisoBox.style.display = "block";
  cargarMontajes();
  setTimeout(cerrarPanel, 1500);
}

const canvasFirma = document.getElementById("firma_canvas");
canvasFirma.addEventListener("mousedown", iniciarTrazo);
canvasFirma.addEventListener("mousemove", trazar);
window.addEventListener("mouseup", terminarTrazo);
canvasFirma.addEventListener("touchstart", iniciarTrazo);
canvasFirma.addEventListener("touchmove", trazar);
canvasFirma.addEventListener("touchend", terminarTrazo);

comprobarSesion();
// leyendas de color de los listados
(function () {
  const estados = [["en_proceso", "En proceso", "#6366f1"], ["recepcionado_parcial", "Recepción parcial", "#ca8a04"], ["recepcionado_total", "Recepcionado", "#0891b2"],
                   ["agendado", "Agendado", "#7c3aed"], ["completado", "Completado", "#16a34a"], ["incidencia", "Incidencia", "#dc2626"], ["terminado_incidencia", "Terminado con incidencia", "#9a3412"]];
  const pon = (id, items) => { const el = document.getElementById(id); if (el) el.innerHTML = items.map(([c, t]) => `<span style="--c:${c}">${t}</span>`).join(""); };
  pon("leyenda_estados", estados.map(([k, t, c]) => [c, t]));
  pon("leyenda_recibido", [["#16a34a", "Recibido"], ["#d97706", "Pendiente de recibir"]]);
  pon("leyenda_entradas", [["#16a34a", "Enlazada con su orden (exacta)"], ["#94a3b8", "Deducida por el nº de pedido (entrada antigua)"]]);
})();
// marca en azul en qué pantalla y en qué menú estás
(function () {
  const pagina = location.pathname.split("/").pop() || "index.html";
  const destino = { "punteo.html": "pedidos.html" }[pagina] || pagina;
  document.querySelectorAll("#toolbar button[onclick]").forEach(b => {
    if ((b.getAttribute("onclick") || "").includes("'" + destino + "'")) b.classList.add("activo");
  });
  const menu = { "pedidos.html": "ordenes", "punteo.html": "ordenes", "sistema.html": "sistema" }[pagina];
  if (menu) { const m = document.querySelector('.menu-item[data-menu="' + menu + '"]'); if (m) m.classList.add("activo-menu"); }
  // y, dentro de los menús desplegables, la opción de la pantalla actual
  const cat = new URLSearchParams(location.search).get("cat") || "";
  document.querySelectorAll(".menu-drop a[href]").forEach(a => {
    const [ruta, consulta] = a.getAttribute("href").split("?");
    if (ruta === pagina && (!consulta || (new URLSearchParams(consulta).get("cat") || "") === cat)) a.classList.add("activo-link");
  });
})();
</script>
