<script>
const client=supabase.createClient("https://uamgbtbsxbrgymhqalak.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWdidGJzeGJyZ3ltaHFhbGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTMyOTIsImV4cCI6MjA5OTg4OTI5Mn0.0OClM8yZmfkiXynOkGLQiLRX-XZjkkP63z5UfIgck8k");

const HOY=new Date(), HOYS=HOY.toISOString().slice(0,10), ANYO_MIN=2026;

try{const g=+localStorage.getItem('cont_anyo');if(g>=ANYO_MIN&&g<=HOY.getFullYear()+1)ANYO=g;}catch(e){}

/* ---------- estado ---------- */
const S={facturas:[],cobros:[],tarifas:{},tarOrigen:{},gastos:[],otros:[],nom:[],trab:[],adelantos:[],liqDesde:7};
async function todo(tabla){let out=[],desde=0;for(;;){const {data,error}=await client.from(tabla).select('*').range(desde,desde+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;desde+=1000;}return out;}
async function recargar(){
  const [cfg,tar,fac,cob,gas,otr,tr,nom,ade]=await Promise.all(['cont_config','cont_tarifas','cont_facturas','cont_cobros','cont_gastos','cont_otros_ingresos','cont_trabajadores','cont_nominas','cont_adelantos'].map(todo));
  S.liqDesde=(cfg.find(c=>c.anyo===ANYO)||{liq_desde:ANYO===ANYO_MIN?7:1}).liq_desde;   // 2026: desde julio; años nuevos: desde enero
  S.tarifas={};S.tarOrigen={};tar.forEach(x=>{S.tarifas[x.cliente]=+x.pct_montaje;S.tarOrigen[x.cliente]=x.origen||'';});

  const porId=Object.fromEntries(S.facturas.map(f=>[f.id,f]));
  S.cobros=cob.filter(c=>porId[c.factura_id]).map(c=>({id:c.id,fecha:c.fecha||'',cli:porId[c.factura_id].cli,num:porId[c.factura_id].num,imp:+c.importe,forma:c.forma_pago||'',obs:c.observaciones||''}));
  S.gastos=gas.filter(g=>g.anyo===ANYO).map(g=>({id:g.id,mes:g.mes,fecha:g.fecha,conc:g.concepto||'',prov:g.proveedor||'',cat:g.categoria,sop:g.soporta,imp:+g.importe,iva:g.iva_pct!=null?+g.iva_pct:undefined}));
  S.otros=otr.filter(o=>o.anyo===ANYO).map(o=>({id:o.id,mes:o.mes,cli:o.cliente||'',conc:o.concepto||'',fecha:o.fecha,cobra:o.cobra,rep:o.reparto,imp:+o.importe}));
  S.trab=tr.map(w=>({id:w.id,nombre:w.nombre,sop:w.soporta,base:+w.nomina_base,extras:+w.extras,alta:w.fecha_alta,baja:w.fecha_baja,motivo:w.motivo_baja||''}));
  const tw=Object.fromEntries(S.trab.map(w=>[w.id,w]));
  S.nom=nom.filter(n=>n.anyo===ANYO&&tw[n.trabajador_id]).map(n=>({id:n.id,mes:n.mes,nombre:tw[n.trabajador_id].nombre,sop:tw[n.trabajador_id].sop,trabId:n.trabajador_id,base:+n.base,extras:+n.extras,rec:+n.recogidas,sab:+n.sabados,emb:+n.embargos,irpf:+n.irpf}));
  S.adelantos=ade.filter(a=>a.anyo===ANYO&&tw[a.trabajador_id]).map(a=>({id:a.id,mes:a.mes,nombre:tw[a.trabajador_id].nombre,trabId:a.trabajador_id,fecha:a.fecha,imp:+a.importe,metodo:a.metodo||''}));
}
async function guardar(fn){try{await fn();await recargar();return true;}catch(e){console.error(e);alert('No se ha podido guardar: '+(e.message||e));return false;}}
async function dbIns(tab,rows){const {data,error}=await client.from(tab).insert(rows).select();if(error)throw error;return data;}
async function dbUpd(tab,id,obj){const {error}=await client.from(tab).update(obj).eq('id',id);if(error)throw error;}
async function dbDel(tab,id){const {error}=await client.from(tab).delete().eq('id',id);if(error)throw error;}
async function logout(){await client.auth.signOut();location.href='login.html';}
const V={tab:'resumen',mes:Math.max(1,Math.min(MES_ACT,12)),lib:{q:'',cli:'',serie:'',trim:'',est:'',sort:'fecha',dir:-1},pend:{cli:''},pers:{t:''},iva:{tit:'Arturo'},my:{tit:'Arturo',vista:'mayor',cta:'572'},cob:{q:'',mes:''},cl:{sort:'total',dir:-1}};

/* ---------- utilidades ---------- */
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const eur=x=>(x==null||x===''?'':Number(x).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €');
const eur0=x=>(x==null?'':Number(x).toLocaleString('es-ES',{maximumFractionDigits:0})+' €');
const fdate=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mesDe=s=>parseInt(s.slice(5,7),10);
const cls=x=>x<-0.005?'neg':(x>0.005?'pos':'');
function days360(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);let dd1=Math.min(d1,30),dd2=d2;if(dd2===31&&dd1>=30)dd2=30;return 360*(y2-y1)+30*(m2-m1)+(dd2-dd1);}
function diasDesde(s){return Math.round((new Date(HOYS)-new Date(s))/86400000);}
const pctM=cli=>(S.tarifas[cli]!=null?S.tarifas[cli]:1);
const socioDe=num=>num.startsWith('3-')?'José':'Arturo';
const fnum=n=>{const p=String(n).split('-');return p.length===2?p[0]+'-'+ANYO+'/'+p[1]:n;};
const IVA=0.21;
const IVA_CAT={'Dietas y desplazamientos':10,'Seguridad Social':0,'Seguros':0,'Gasoil':21,'Mecánico / Vehículos':21,'Proveedores':21,'IVA':0,'IVA aplazado':0,'Impuestos':0,'Préstamos':0,'Telefonía / Internet':21,'Suministros':21,'Gestoría / Asesoría':21,'Material y herramientas':21,'Alquileres':21,'Multas y sanciones':0,'Comisiones bancarias':0,'Otros':21};
const ivaGasto=g=>(g.iva!=null?g.iva:(IVA_CAT[g.cat]||0));
const pad2=n=>String(n).padStart(2,'0');
const finMes=m=>ANYO+'-'+pad2(m)+'-'+pad2(new Date(ANYO,m,0).getDate());

/* ---------- cálculos (lo que hacían las fórmulas del Excel) ---------- */
function facturas(){
  const cob={};S.cobros.forEach(c=>{const k=c.cli+'|'+c.num;cob[k]=(cob[k]||0)+c.imp;});
  return S.facturas.map(f=>{
    const mont=f.auto?f.total*pctM(f.cli):f.mont0;
    const cobrado=r2(cob[f.cli+'|'+f.num]||0);
    const mes=mesDe(f.fecha);
    return Object.assign({},f,{mont,alm:f.total-mont,cobrado,pend:r2(f.total-cobrado),mes,trim:'T'+Math.ceil(mes/3),dias:f.fpago?days360(f.fecha,f.fpago):0,socio:socioDe(f.num),serie:f.num.split('-')[0]});
  });
}
function otrosParts(o){const p=S.tarifas[o.cli];return p!=null?{m:o.imp*p,a:o.imp*(1-p)}:{m:o.imp,a:0};}
function mesCalc(m){
  const F=facturas().filter(f=>f.mes===m);
  const per={};
  F.forEach(f=>{const r=per[f.cli]||(per[f.cli]={cli:f.cli,am:0,aa:0,jm:0,ja:0});if(f.socio==='Arturo'){r.am+=f.mont;r.aa+=f.alm;}else{r.jm+=f.mont;r.ja+=f.alm;}});
  const filas=Object.values(per).sort((a,b)=>(b.am+b.aa+b.jm+b.ja)-(a.am+a.aa+a.jm+a.ja));
  const T=filas.reduce((t,r)=>({am:t.am+r.am,aa:t.aa+r.aa,jm:t.jm+r.jm,ja:t.ja+r.ja}),{am:0,aa:0,jm:0,ja:0});
  const O=S.otros.filter(o=>o.mes===m);
  const otrosTot=O.reduce((s,o)=>s+o.imp,0);
  let oRepA=0,oRepJ=0,oAlm=0,oSoloA=0,oSoloJ=0;
  O.forEach(o=>{const p=otrosParts(o);if(o.rep==='50/50'){if(o.cobra==='Arturo')oRepA+=p.m;else oRepJ+=p.m;oAlm+=p.a;}else{if(o.cobra==='Arturo')oSoloA+=o.imp;else oSoloJ+=o.imp;}});
  const G=S.gastos.filter(g=>g.mes===m);
  const porCat={};CATS.forEach(c=>porCat[c]=0);G.forEach(g=>{porCat[g.cat]=(porCat[g.cat]||0)+g.imp;});
  const gTot=G.reduce((s,g)=>s+g.imp,0);
  const gA=G.filter(g=>g.sop==='Arturo').reduce((s,g)=>s+g.imp,0),gJ=G.filter(g=>g.sop==='José').reduce((s,g)=>s+g.imp,0);
  const N=S.nom.filter(n=>n.mes===m).map(n=>Object.assign({},n,{total:n.base+n.extras+n.rec+n.sab+n.emb+n.irpf,adel:S.adelantos.filter(a=>a.nombre===n.nombre&&a.mes===m).reduce((s,a)=>s+a.imp,0)}));
  const nTot=N.reduce((s,n)=>s+n.total,0),nA=N.filter(n=>n.sop==='Arturo').reduce((s,n)=>s+n.total,0),nJ=N.filter(n=>n.sop==='José').reduce((s,n)=>s+n.total,0);
  const ingresos=T.am+T.jm+T.aa+T.ja+otrosTot;
  return {m,filas,T,O,otrosTot,oRepA,oRepJ,oAlm,oSoloA,oSoloJ,G,porCat,gTot,gA,gJ,N,nTot,nA,nJ,ingresos,gastos:gTot+nTot,resultado:ingresos-gTot-nTot};
}
function liquidacion(m){
  const c=mesCalc(m);
  const rep=c.T.am+c.T.jm+c.oRepA+c.oRepJ, gastosT=c.gTot+c.nTot;
  const netoA=c.T.am+c.oRepA-c.gA-c.nA, netoJ=c.T.jm+c.oRepJ-c.gJ-c.nJ;
  const resultado=rep-gastosT, mitad=resultado/2, saldoA=netoA-mitad, saldoJ=netoJ-mitad;
  return {m,mA:c.T.am,mJ:c.T.jm,oA:c.oRepA,oJ:c.oRepJ,rep,gA:c.gA,gJ:c.gJ,nA:c.nA,nJ:c.nJ,sinAsig:gastosT-c.gA-c.gJ-c.nA-c.nJ,gastosT,netoA,netoJ,resultado,mitad,saldoA,saldoJ,almA:c.T.aa+c.T.ja+c.oAlm,soloA:c.oSoloA,soloJ:c.oSoloJ};
}

/* ---------- exportar a Excel ---------- */
function exportarExcel(){
  if(typeof XLSX==='undefined'){alert('No se ha podido cargar el generador de Excel. Revisa la conexión y recarga la página.');return;}
  const d=s=>s?new Date(s+'T00:00:00'):'';
  const wb=XLSX.utils.book_new();
  const hoja=(nombre,filas,vacio)=>{const ws=XLSX.utils.json_to_sheet(filas.length?filas:[vacio]);ws['!cols']=Object.keys(filas[0]||vacio).map(k=>({wch:Math.min(45,Math.max(k.length+2,...filas.slice(0,200).map(r=>String(r[k]==null?'':(r[k] instanceof Date?'00/00/0000':r[k])).length+2)))}));XLSX.utils.book_append_sheet(wb,ws,nombre);};

  hoja('Otros ingresos',S.otros.map(o=>({Mes:MES[o.mes-1]||o.mes,Fecha:d(o.fecha),Cliente:o.cli,Concepto:o.conc,Cobra:o.cobra,Reparto:o.rep,Importe:o.imp})),{Mes:''});
  hoja('Nóminas',S.nom.map(n=>({Mes:MES[n.mes-1]||n.mes,Trabajador:n.nombre,Soporta:n.sop,Base:n.base,Extras:n.extras,Recogidas:n.rec,Sábados:n.sab,Embargos:n.emb,IRPF:n.irpf,Total:r2(n.base+n.extras+n.rec+n.sab+n.emb+n.irpf)})),{Mes:''});
  hoja('Adelantos',S.adelantos.map(a=>({Mes:MES[a.mes-1]||a.mes,Trabajador:a.nombre,Fecha:d(a.fecha),Importe:a.imp,Método:a.metodo})),{Mes:''});
  hoja('Personal',S.trab.map(w=>({Nombre:w.nombre,Soporta:w.sop,'Nómina base':w.base,Extras:w.extras,Alta:d(w.alta),Baja:d(w.baja),'Motivo baja':w.motivo})),{Nombre:''});
  hoja('Tarifas',Object.keys(S.tarifas).sort().map(c=>({Cliente:c,'% montaje':S.tarifas[c]})),{Cliente:''});

/* ===================== RESUMEN ANUAL ===================== */
function vResumen(){
  const D=S.liqDesde;
  const M=[];for(let m=1;m<=12;m++)M.push(m<=MES_ACT?mesCalc(m):null);
  const ok=(c,sd)=>c&&(!sd||c.m>=D);
  const sum=(f,sd)=>M.reduce((s,c)=>s+(ok(c,sd)?f(c):0),0);
  const fila=(lab,f,cl='',sd=false)=>`<tr class="${cl}"><td>${lab}</td>${M.map(c=>`<td class="n">${ok(c,sd)?eur0(f(c)):''}</td>`).join('')}<td class="n"><b>${eur0(sum(f,sd))}</b></td></tr>`;
  const tI=sum(c=>c.ingresos),tId=sum(c=>c.ingresos,true),tG=sum(c=>c.gastos,true);
  const maxv=Math.max(1,...M.map(c=>c?Math.max(c.ingresos,c.m>=D?c.gastos:0):0));
  const W=900,H=200,bw=26,gap=(W-60)/12;
  let svg=`<svg viewBox="0 0 ${W} ${H+34}" style="width:100%;max-height:260px">`;
  [0,.5,1].forEach(p=>{const y=H-p*(H-14);svg+=`<line x1="40" x2="${W}" y1="${y}" y2="${y}" stroke="#e2e4eb"/><text x="36" y="${y+4}" font-size="10" text-anchor="end" fill="#6b7280">${Math.round(maxv*p/1000)}k</text>`;});
  M.forEach((c,i)=>{const x=50+i*gap;svg+=`<text x="${x+bw}" y="${H+16}" font-size="10" text-anchor="middle" fill="#6b7280">${MES[i].slice(0,3)}</text>`;
    if(!c)return;const hi=c.ingresos/maxv*(H-14);
    svg+=`<rect x="${x}" y="${H-hi}" width="${bw}" height="${hi}" rx="3" fill="#2563eb"><title>${MES[i]} ingresos ${eur(c.ingresos)}</title></rect>`;
    if(c.m>=D){const hg=c.gastos/maxv*(H-14);svg+=`<rect x="${x+bw+2}" y="${H-hg}" width="${bw}" height="${hg}" rx="3" fill="#f59e0b"><title>${MES[i]} gastos ${eur(c.gastos)}</title></rect>`;}});
  svg+='</svg>';
  return cab('Resumen anual — ingresos y gastos '+ANYO,'Una columna por mes. Enero–junio solo sirven para calcular ingresos: sus gastos y resultado no se muestran ni cuentan.','RESUMEN ANUAL')+
  `<div class="cards"><div class="card"><div class="k">Ingresos del año (todo ${ANYO})</div><div class="v">${eur0(tI)}</div></div><div class="card"><div class="k">Gastos (desde ${MES[D-1].toLowerCase()})</div><div class="v">${eur0(tG)}</div></div><div class="card ${tId-tG>=0?'ok':'bad'}"><div class="k">Resultado (desde ${MES[D-1].toLowerCase()})</div><div class="v">${eur0(tId-tG)}</div></div></div>
  <div class="box" style="margin-bottom:14px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px"><span style="color:#2563eb">■</span> Ingresos &nbsp; <span style="color:#f59e0b">■</span> Gastos</div>${svg}</div>
  <div class="tw"><table><thead><tr><th></th>${MES.map(m=>`<th class="n s" data-mes="${MES.indexOf(m)+1}" title="Ir al mes">${m.slice(0,3)}</th>`).join('')}<th class="n">TOTAL AÑO</th></tr></thead><tbody>
  <tr class="sec"><td colspan="14">INGRESOS</td></tr>
  ${fila('Montaje (Arturo + José)',c=>c.T.am+c.T.jm)}${fila('Almacén',c=>c.T.aa+c.T.ja)}${fila('Otros ingresos',c=>c.otrosTot)}${fila('TOTAL INGRESOS',c=>c.ingresos,'tot')}
  <tr class="sec"><td colspan="14">GASTOS POR CONCEPTO (desde ${MES[D-1].toLowerCase()})</td></tr>
  ${fila('Nóminas',c=>c.nTot,'',true)}${CATS.map(k=>fila(k,c=>c.porCat[k]||0,'',true)).join('')}${fila('TOTAL GASTOS',c=>c.gastos,'tot',true)}
  ${fila('RESULTADO (ingresos − gastos)',c=>c.resultado,'res',true)}
  </tbody></table></div>`;
}

/* ===================== LIBRO DE FACTURAS ===================== */
function listaLibro(){
  const q=V.lib.q.toLowerCase();
  let F=facturas().filter(f=>(!q||(f.cli+' '+f.num+' '+fnum(f.num)+' '+f.conc).toLowerCase().includes(q))&&(!V.lib.cli||f.cli===V.lib.cli)&&(!V.lib.serie||f.serie===V.lib.serie)&&(!V.lib.trim||f.trim===V.lib.trim)&&(V.lib.est===''||(V.lib.est==='p'?f.pend>0.005:f.pend<=0.005)));
  const k=V.lib.sort,d=V.lib.dir;
  F.sort((a,b)=>{const x=a[k],y=b[k];return (x>y?1:x<y?-1:0)*d||b.id-a.id;});
  return F;
}
function vLibro(){
  const F=listaLibro(),clientes=[...new Set(S.facturas.map(f=>f.cli))].sort();

  <div class="tw" style="max-height:62vh"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Nº factura</th><th class="n">Importe</th><th>Forma de pago</th><th>Observaciones</th><th></th></tr></thead><tbody>${C.slice(0,300).map(c=>`<tr><td>${fdate(c.fecha)}</td><td>${esc(c.cli)}</td><td><b>${esc(fnum(c.num))}</b></td><td class="n">${eur(c.imp)}</td><td>${esc(c.forma)}</td><td>${esc(c.obs)}</td><td><button class="rojo peq" data-delc="${c.i}" title="Anular este cobro">✕</button></td></tr>`).join('')||'<tr><td colspan="7" class="vacio">Sin cobros</td></tr>'}</tbody></table></div>
  <div class="nota az">«Registrar cobro» sustituye a la macro del Excel: aquella preguntaba todo con 5 cuadros de texto sueltos (nº de cliente, nº de facturas, importe, fecha, forma). Aquí es una sola ventana, con el reparto a la vista antes de confirmar.</div>`;

const W={cli:'',sel:new Set(),imp:'',fecha:HOYS,forma:'TRANSFERENCIA'};
function abrirCobro(num,cli){
  W.cli=cli||'';W.sel=new Set(num?[num]:[]);W.imp='';W.fecha=HOYS;W.forma='TRANSFERENCIA';cuerpoCobro();
}
function pendCli(cli){return facturas().filter(f=>f.cli===cli&&f.pend>0.005).sort((a,b)=>a.fecha>b.fecha?1:a.fecha<b.fecha?-1:0);}
function cuerpoCobro(){
  const cl=[...new Set(facturas().filter(f=>f.pend>0.005).map(f=>f.cli))].sort();
  const P=W.cli?pendCli(W.cli):[];
  abrir(`<h3>Registrar cobro</h3>
  <div class="fg"><div style="grid-column:1/-1"><label class="l">1 · Cliente (solo los que tienen algo pendiente)</label><select id="wcli"><option value="">— elige —</option>${cl.map(c=>`<option ${W.cli===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
  ${W.cli?`<label class="l">2 · Facturas que se cobran (más recientes arriba; el importe se reparte empezando por la más antigua)</label>
  <div class="chk">${P.slice().reverse().map(f=>`<label><input type="checkbox" data-wsel="${esc(f.num)}" ${W.sel.has(f.num)?'checked':''}> <b>${esc(fnum(f.num))}</b> <span>${fdate(f.fecha)}</span><span class="r">total ${eur(f.total)} · <b>pendiente ${eur(f.pend)}</b></span></label>`).join('')}</div>
  <div style="margin-top:6px"><button class="sec peq" data-wall="1">Marcar todas</button> <button class="sec peq" data-wnone="1">Ninguna</button></div>
  <div class="fg" style="margin-top:12px"><div><label class="l">3 · Importe total cobrado (vacío = todo lo pendiente)</label><input id="wimp" type="number" step="0.01" value="${esc(W.imp)}"></div><div><label class="l">Fecha del cobro</label><input id="wfecha" type="date" value="${W.fecha}"></div><div><label class="l">Forma de pago</label><select id="wforma">${['TRANSFERENCIA','EFECTIVO','TALON'].map(f=>`<option ${W.forma===f?'selected':''}>${f}</option>`).join('')}</select></div></div>
  <div class="prev" id="wprev"></div>`:''}
  <div class="acc"><button class="sec" data-cerrar="1">Cancelar</button><button id="wok" data-wok="1" disabled>Confirmar cobro</button></div>`);
  if(W.cli)prevCobro();
}
function repartoCobro(){
  const P=pendCli(W.cli).filter(f=>W.sel.has(f.num));if(!P.length)return null;
  const tot=r2(P.reduce((s,f)=>s+f.pend,0));let cobro=W.imp===''?tot:r2(+W.imp);
  if(!(cobro>0))return {P,tot,cobro:0,ap:[],err:'Importe no válido'};
  let rest=cobro;const ap=P.map((f,k)=>{let a=(k===P.length-1)?rest:Math.min(rest,f.pend);a=r2(a);rest=r2(Math.max(0,rest-a));return {f,a};});
  return {P,tot,cobro,ap,exceso:cobro>tot+0.005};
}
function prevCobro(){
  const el=document.getElementById('wprev'),ok=document.getElementById('wok');if(!el)return;
  const R=repartoCobro();
  if(!R){el.innerHTML='<span style="color:var(--muted)">Marca al menos una factura para ver cómo se reparte el cobro.</span>';ok.disabled=true;return;}
  if(R.err){el.innerHTML=`<span class="neg">${R.err}</span>`;ok.disabled=true;return;}
  el.innerHTML=`<b>Reparto de ${eur(R.cobro)}</b> (pendiente de lo marcado: ${eur(R.tot)})<br>`+R.ap.filter(x=>x.a>0.004).map(x=>`· ${esc(fnum(x.f.num))}: ${eur(x.a)} ${x.a<x.f.pend-0.005?'<span class="chip w">parcial</span>':'<span class="chip ok">total</span>'}`).join('<br>')+(R.exceso?'<br><span class="neg">El importe supera lo pendiente: el exceso se apunta en la última factura.</span>':'');
  ok.disabled=false;
}
async function confirmarCobro(){
  const R=repartoCobro();if(!R||R.err)return;const conj=R.ap.filter(x=>x.a>0.004).length>1;
  const ok=await guardar(async()=>{
    for(const x of R.ap){if(x.a<=0.004)continue;const fa=S.facturas.find(z=>z.cli===W.cli&&z.num===x.f.num);
      await dbIns('cont_cobros',{factura_id:fa.id,fecha:W.fecha,importe:x.a,forma_pago:W.forma,observaciones:(x.a<x.f.pend-0.005?'Cobro parcial':'Cobro total')+(conj?' (pago conjunto)':'')});
      await dbUpd('cont_facturas',fa.id,{forma_pago:W.forma,fecha_pago:W.fecha});}
  });
  if(ok){cerrar();render();}
}

/* ===================== IVA Y MODELOS ===================== */
const NODED=['IVA','IVA aplazado','Impuestos','Préstamos','Multas y sanciones'];
function fiscal(tit){
  const D=S.liqDesde,Q=[1,2,3,4].map(q=>({q,devB:0,devC:0,sopB:0,sopC:0,ing:0,gas:0}));
  facturas().filter(f=>f.mes>=D&&f.mes<=MES_ACT&&f.socio===tit&&f.serie!=='5').forEach(f=>{const r=Q[Math.ceil(f.mes/3)-1],b=f.total/(1+IVA);r.ing+=b;r.devB+=b;r.devC+=f.total-b;});
  S.gastos.filter(g=>g.mes>=D&&g.mes<=MES_ACT&&g.sop===tit).forEach(g=>{const r=Q[Math.ceil(g.mes/3)-1],iv=ivaGasto(g),b=g.imp/(1+iv/100);if(iv>0){r.sopB+=b;r.sopC+=g.imp-b;}if(!NODED.includes(g.cat))r.gas+=b;});
  S.nom.filter(n=>n.mes>=D&&n.mes<=MES_ACT&&n.sop===tit).forEach(n=>{Q[Math.ceil(n.mes/3)-1].gas+=n.base+n.extras+n.rec+n.sab+n.emb+n.irpf;});
  let ai=0,ag=0,pagado=0;
  Q.forEach(r=>{ai+=r.ing;ag+=r.gas;r.aci=ai;r.acg=ag;r.rend=ai-ag;r.cuota=Math.max(0,r.rend)*0.2;r.res303=r.devC-r.sopC;r.res130=r.cuota-pagado;pagado+=Math.max(0,r.res130);});
  return Q;
}

  const tit=V.iva.tit,Q=fiscal(tit);
  const est=q=>q*3<S.liqDesde?'x':((q-1)*3+1>MES_ACT?'f':(q*3<=MES_ACT?'c':'e'));
  const plazo=['hasta el 20 de abril','hasta el 20 de julio','hasta el 20 de octubre','hasta el 30 de enero'];
  const celda=(q,f)=>(est(q.q)==='f'||est(q.q)==='x')?'<td class="n"></td>':`<td class="n">${f(q)}</td>`;

  const cabQ=Q.map(q=>`<th class="n">T${q.q} ${est(q.q)==='e'?'<span class="chip w">en curso</span>':est(q.q)==='x'?'<span class="chip" style="background:#f1f5f9;color:#64748b">no computa</span>':est(q.q)==='f'?'':'<span class="chip ok">cerrado</span>'}</th>`).join('');
  const porCli={};facturas().filter(f=>f.mes>=S.liqDesde&&f.mes<=MES_ACT&&f.socio===tit&&f.serie!=='5').forEach(f=>{const r=porCli[f.cli]||(porCli[f.cli]={cli:f.cli,t:[0,0,0,0]});r.t[Math.ceil(f.mes/3)-1]+=f.total;});
  const L347=Object.values(porCli).map(r=>Object.assign(r,{tot:r.t.reduce((a,b)=>a+b,0)})).filter(r=>r.tot>3005.06).sort((a,b)=>b.tot-a.tot);
  const ivaPag=S.gastos.filter(g=>g.sop===tit&&(g.cat==='IVA'||g.cat==='IVA aplazado')&&g.mes>=S.liqDesde&&g.mes<=MES_ACT).reduce((s,g)=>s+g.imp,0);
  return cab('IVA trimestral y modelos de Hacienda','Calculado con lo ya apuntado desde '+MES[S.liqDesde-1].toLowerCase()+'. Cada uno por separado: Arturo (series 1 y 2) y José (serie 3). Sin proformas.','nada: el Excel no calculaba impuestos')+
  `<div class="bar"><div><label class="l">Presenta</label><select id="ivatit"><option ${tit==='Arturo'?'selected':''}>Arturo</option><option ${tit==='José'?'selected':''}>José</option></select></div></div>
  <div class="nota"><b>Solo orientativo.</b> Tú apuntas siempre el total (de la factura o del gasto) y la app separa la base y el IVA (21 % en las facturas; en los gastos, según su categoría, que se puede cambiar). El gestor sigue haciendo la liquidación real como hasta ahora.</div>
  <h3>Modelo 303 — IVA trimestral</h3>
  <div class="tw"><table><thead><tr><th></th>${cabQ}</tr></thead><tbody>
  <tr><td>Base imponible de las ventas (IVA 21 %)</td>${Q.map(q=>celda(q,x=>eur(x.devB))).join('')}</tr>
  <tr><td>IVA repercutido (cobrado a clientes)</td>${Q.map(q=>celda(q,x=>eur(x.devC))).join('')}</tr>
  <tr><td>Base de las compras y gastos con IVA</td>${Q.map(q=>celda(q,x=>eur(x.sopB))).join('')}</tr>
  <tr><td>IVA soportado deducible (pagado a proveedores)</td>${Q.map(q=>celda(q,x=>eur(x.sopC))).join('')}</tr>
  <tr class="tot"><td>RESULTADO (repercutido − soportado)</td>${Q.map(q=>celda(q,x=>`<b>${eur(x.res303)}</b> ${chipR(x.res303)}`)).join('')}</tr>
  <tr><td style="color:var(--muted)">Plazo de presentación</td>${Q.map(q=>`<td class="n" style="color:var(--muted)">${plazo[q.q-1]}</td>`).join('')}</tr>
  </tbody></table></div>
  <div class="sub" style="margin-top:6px">IVA ya pagado a Hacienda este año según los gastos apuntados («IVA» e «IVA aplazado»): <b>${eur(ivaPag)}</b>.</div>

  <tr><td>20 % del rendimiento</td>${Q.map(q=>celda(q,x=>eur(x.cuota))).join('')}</tr>
  <tr class="tot"><td>A INGRESAR (menos lo ya pagado en trimestres anteriores)</td>${Q.map(q=>celda(q,x=>`<b>${eur(x.res130)}</b>`)).join('')}</tr>
  </tbody></table></div>
  <div class="nota az">Enero–junio no entran en ningún modelo y las <b>proformas (serie 5)</b> quedan siempre fuera. Por eso el 130 acumula solo desde ${MES[S.liqDesde-1].toLowerCase()} y no equivale al 130 real del año.</div>
  <h3>Modelo 347 — clientes con más de 3.005,06 € en el año</h3>
  <div class="tw"><table><thead><tr><th>Cliente</th><th class="n">T1</th><th class="n">T2</th><th class="n">T3</th><th class="n">T4</th><th class="n">Total año (con IVA)</th></tr></thead><tbody>${L347.map(r=>`<tr><td>${esc(r.cli)}</td>${r.t.map(x=>`<td class="n">${x?eur(x):''}</td>`).join('')}<td class="n"><b>${eur(r.tot)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="vacio">Ninguno</td></tr>'}</tbody></table></div>
  <div class="nota az">Para el 347 hacen falta el <b>NIF</b> de cada cliente (estará en la ficha de la tienda: pendiente) y también las compras a proveedores, que ahora no se apuntan con proveedor ni NIF. Los modelos 111 (retenciones de nóminas), 115, 190 y 390 quedarían para una siguiente fase.</div>`;
}

/* ===================== LIBRO MAYOR ===================== */
const PGC={'430':'Clientes','705':'Prestaciones de servicios','477':'H.P. IVA repercutido','472':'H.P. IVA soportado','4750':'H.P. acreedora por IVA','4751':'H.P. acreedora por retenciones','572':'Bancos y efectivo (tesorería)','600':'Compras de mercaderías','602':'Compras de otros aprovisionamientos','621':'Arrendamientos y cánones','622':'Reparaciones y conservación','623':'Servicios de profesionales','625':'Primas de seguros','626':'Servicios bancarios','628':'Suministros','629':'Otros servicios','640':'Sueldos y salarios','642':'Seguridad Social a cargo de la empresa','465':'Remuneraciones pendientes de pago','460':'Anticipos de remuneraciones','520':'Deudas a c/p con entidades de crédito','678':'Gastos excepcionales'};
const CTA_CAT={'Dietas y desplazamientos':'629','Seguridad Social':'642','Seguros':'625','Gasoil':'628','Mecánico / Vehículos':'622','Proveedores':'600','IVA':'4750','IVA aplazado':'4750','Impuestos':'4751','Préstamos':'520','Telefonía / Internet':'629','Suministros':'628','Gestoría / Asesoría':'623','Material y herramientas':'602','Alquileres':'621','Multas y sanciones':'678','Comisiones bancarias':'626','Otros':'629'};
function asientos(){
  const A=[];
  facturas().filter(f=>f.mes>=S.liqDesde&&f.mes<=MES_ACT&&f.serie!=='5').forEach(f=>{const l=[{c:'430',d:f.total,h:0}];{const b=r2(f.total/(1+IVA));l.push({c:'705',d:0,h:b},{c:'477',d:0,h:r2(f.total-b)});}A.push({f:f.fecha,tit:f.socio,ref:'Factura '+fnum(f.num),desc:f.cli,l});});
  S.cobros.filter(c=>{const fa=S.facturas.find(z=>z.cli===c.cli&&z.num===c.num);return fa&&mesDe(fa.fecha)>=S.liqDesde&&c.num.split('-')[0]!=='5';}).forEach(c=>A.push({f:c.fecha||S.facturas.find(z=>z.cli===c.cli&&z.num===c.num).fecha,tit:socioDe(c.num),ref:'Cobro '+fnum(c.num),desc:c.cli+' · '+(c.forma||''),l:[{c:'572',d:c.imp,h:0},{c:'430',d:0,h:c.imp}]}));
  S.gastos.filter(g=>g.mes>=S.liqDesde&&g.mes<=MES_ACT).forEach(g=>{const iv=ivaGasto(g),b=r2(g.imp/(1+iv/100)),l=[{c:CTA_CAT[g.cat]||'629',d:b,h:0}];if(iv>0)l.push({c:'472',d:r2(g.imp-b),h:0});l.push({c:'572',d:0,h:g.imp});A.push({f:g.fecha||finMes(g.mes),tit:g.sop,ref:'Gasto · '+g.cat,desc:[g.conc,g.prov].filter(Boolean).join(' · '),l});});
  S.nom.filter(n=>n.mes>=S.liqDesde&&n.mes<=MES_ACT).forEach(n=>{const t=n.base+n.extras+n.rec+n.sab+n.emb+n.irpf;if(!t)return;const ad=S.adelantos.filter(a=>a.nombre===n.nombre&&a.mes===n.mes).reduce((s,a)=>s+a.imp,0);
    A.push({f:finMes(n.mes),tit:n.sop,ref:'Nómina '+MES[n.mes-1].toLowerCase(),desc:n.nombre+' · devengo',l:[{c:'640',d:t,h:0},{c:'465',d:0,h:t}]});
    const l=[{c:'465',d:t,h:0}];if(ad)l.push({c:'460',d:0,h:ad});l.push({c:'572',d:0,h:r2(t-ad)});A.push({f:finMes(n.mes),tit:n.sop,ref:'Nómina '+MES[n.mes-1].toLowerCase(),desc:n.nombre+' · pago',l});});
  S.adelantos.filter(a=>a.mes>=S.liqDesde&&a.mes<=MES_ACT).forEach(a=>{const w=S.trab.find(t=>t.nombre===a.nombre);A.push({f:a.fecha||finMes(a.mes),tit:w?w.sop:'Arturo',ref:'Adelanto',desc:a.nombre+(a.fecha?'':' (mes '+MES[a.mes-1].toLowerCase()+')'),l:[{c:'460',d:a.imp,h:0},{c:'572',d:0,h:a.imp}]});});
  A.sort((x,y)=>x.f<y.f?-1:x.f>y.f?1:0);A.forEach((a,i)=>a.n=i+1);
  return A;
}
function vMayor(){
  const v=V.my,A=asientos().filter(a=>v.tit==='Ambos'||a.tit===v.tit);
  const sal={};A.forEach(a=>a.l.forEach(x=>{const s=sal[x.c]||(sal[x.c]={d:0,h:0});s.d+=x.d;s.h+=x.h;}));
  const ctas=Object.keys(sal).sort();if(!sal[v.cta])v.cta=ctas[0];
  const sel=`<div class="bar"><div><label class="l">Contabilidad de</label><select id="mytit">${['Arturo','José','Ambos'].map(x=>`<option ${v.tit===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="l">Ver</label><select id="myvista"><option value="mayor" ${v.vista==='mayor'?'selected':''}>Libro mayor (una cuenta)</option><option value="diario" ${v.vista==='diario'?'selected':''}>Libro diario (asientos)</option><option value="balance" ${v.vista==='balance'?'selected':''}>Balance de sumas y saldos</option></select></div>${v.vista==='mayor'?`<div><label class="l">Cuenta</label><select id="mycta">${ctas.map(c=>`<option value="${c}" ${v.cta===c?'selected':''}>${c} · ${PGC[c]||''}</option>`).join('')}</select></div>`:''}</div>`;
  let cuerpo='';
  if(v.vista==='mayor'){let s=0;const mv=[];A.forEach(a=>a.l.filter(x=>x.c===v.cta).forEach(x=>{s=r2(s+x.d-x.h);mv.push(`<tr><td>${fdate(a.f)}</td><td class="n">${a.n}</td><td>${esc(a.ref)}</td><td>${esc(a.desc)}</td><td class="n">${x.d?eur(x.d):''}</td><td class="n">${x.h?eur(x.h):''}</td><td class="n ${cls(s)}">${eur(s)}</td></tr>`);}));
    cuerpo=`<div class="cards"><div class="card"><div class="k">${v.cta} · ${PGC[v.cta]||''}</div><div class="v" style="font-size:18px">Saldo ${eur(s)}</div></div><div class="card"><div class="k">Debe</div><div class="v" style="font-size:18px">${eur((sal[v.cta]||{d:0}).d)}</div></div><div class="card"><div class="k">Haber</div><div class="v" style="font-size:18px">${eur((sal[v.cta]||{h:0}).h)}</div></div></div><div class="tw" style="max-height:60vh"><table><thead><tr><th>Fecha</th><th class="n">Asiento</th><th>Concepto</th><th>Detalle</th><th class="n">Debe</th><th class="n">Haber</th><th class="n">Saldo</th></tr></thead><tbody>${mv.join('')}</tbody></table></div>`;}
  else if(v.vista==='diario'){cuerpo=`<div class="tw" style="max-height:66vh"><table><thead><tr><th class="n">Nº</th><th>Fecha</th><th>Concepto</th><th>Cuenta</th><th class="n">Debe</th><th class="n">Haber</th></tr></thead><tbody>${A.slice(-400).map(a=>a.l.map((x,i)=>`<tr><td class="n">${i?'':a.n}</td><td>${i?'':fdate(a.f)}</td><td>${i?'':esc(a.ref)+' · '+esc(a.desc)}</td><td>${x.c} ${PGC[x.c]||''}</td><td class="n">${x.d?eur(x.d):''}</td><td class="n">${x.h?eur(x.h):''}</td></tr>`).join('')).join('')}</tbody></table></div><div class="sub" style="margin-top:6px">Se muestran los últimos 400 asientos de ${A.length}.</div>`;}
  else{let D=0,H=0;cuerpo=`<div class="tw"><table><thead><tr><th>Cuenta</th><th>Nombre</th><th class="n">Debe</th><th class="n">Haber</th><th class="n">Saldo deudor</th><th class="n">Saldo acreedor</th></tr></thead><tbody>${ctas.map(c=>{const s=sal[c],d=r2(s.d-s.h);D+=s.d;H+=s.h;return `<tr><td class="clic" data-mcta="${c}">${c}</td><td>${PGC[c]||''}</td><td class="n">${eur(s.d)}</td><td class="n">${eur(s.h)}</td><td class="n">${d>0?eur(d):''}</td><td class="n">${d<0?eur(-d):''}</td></tr>`;}).join('')}<tr class="tot"><td colspan="2">TOTAL</td><td class="n">${eur(D)}</td><td class="n">${eur(H)}</td><td class="n" colspan="2">${Math.abs(D-H)<0.01?'✓ cuadra':'¡descuadre!'}</td></tr></tbody></table></div>`;}
  return cab('Libro mayor','Los asientos se generan solos a partir de las facturas, cobros, gastos, nóminas y adelantos. Nadie teclea asientos.','nada: el Excel no llevaba contabilidad por cuentas')+sel+cuerpo+
  `<div class="nota">Plan de cuentas <b>propuesto</b> (Plan General Contable): las facturas van a 430/705/477, los cobros y pagos a una única cuenta de tesorería (bancos y efectivo, sin caja aparte), cada categoría de gasto a su cuenta 6xx con el IVA en 472, y las nóminas a 640/465. <b>Reglas:</b> solo desde ${MES[S.liqDesde-1].toLowerCase()} (enero–junio solo sirven para ingresos), sin proformas, sin saldos de apertura y todo pagado/cobrado por la misma cuenta de tesorería. Orientativo: el gestor lleva la contabilidad oficial.</div>`;
}

function formGasto(){abrir(`<h3>Añadir gasto · ${MES[V.mes-1]}</h3><div class="fg"><div><label class="l">Fecha</label><input id="gf" type="date" value="${HOYS}"></div><div><label class="l">Concepto</label><input id="gc"></div><div><label class="l">Proveedor</label><input id="gp"></div><div><label class="l">Categoría</label><select id="gk">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label class="l">Soporta</label><select id="gs"><option>Arturo</option><option>José</option></select></div><div><label class="l">IVA incluido</label><select id="gv"><option value="auto">según categoría</option><option value="0">0 %</option><option value="4">4 %</option><option value="10">10 %</option><option value="21">21 %</option></select></div><div><label class="l">Importe</label><input id="gi" type="number" step="0.01"></div></div><div class="prev" id="gprev" style="margin-top:0">Escribe el total: la app separa la base y el IVA.</div><div class="acc"><button class="sec" data-cerrar="1">Cancelar</button><button data-okg="1">Añadir</button></div>`);}
function formOtro(){abrir(`<h3>Añadir otro ingreso · ${MES[V.mes-1]}</h3><div class="fg"><div><label class="l">Cliente</label><input id="oc"></div><div><label class="l">Concepto</label><input id="oo"></div><div><label class="l">Fecha</label><input id="of" type="date" value="${HOYS}"></div><div><label class="l">Cobra</label><select id="ob"><option>Arturo</option><option>José</option></select></div><div><label class="l">Reparto</label><select id="or"><option>50/50</option><option>Solo quien cobra</option></select></div><div><label class="l">Importe</label><input id="oi" type="number" step="0.01"></div></div><div class="acc"><button class="sec" data-cerrar="1">Cancelar</button><button data-oko="1">Añadir</button></div>`);}
function formFactura(){const cl=[...new Set(S.facturas.map(f=>f.cli))].sort();abrir(`<h3>Factura manual</h3><div class="fg"><div><label class="l">Cliente</label><select id="fc">${cl.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div><label class="l">Nº factura (serie-nº)</label><input id="fn" placeholder="2-150"></div><div><label class="l">Fecha</label><input id="ff" type="date" value="${HOYS}"></div><div><label class="l">Concepto</label><select id="fo"><option>MONTAJE</option><option>ALMACÉN</option></select></div><div><label class="l">Total</label><input id="ft" type="number" step="0.01"></div></div><div class="nota az">Montaje y almacén se calculan solos con la tarifa del cliente.</div><div class="acc"><button class="sec" data-cerrar="1">Cancelar</button><button data-okf="1">Añadir</button></div>`);}
const $=id=>document.getElementById(id);
function gprev(){const imp=+$('gi').value||0,gv=$('gv').value,cat=$('gk').value,iv=gv==='auto'?(IVA_CAT[cat]||0):+gv,b=imp/(1+iv/100);$('gprev').innerHTML=imp?`Total <b>${eur(imp)}</b> = base <b>${eur(b)}</b> + IVA ${iv} % <b>${eur(imp-b)}</b>`:'Escribe el total: la app separa la base y el IVA.';}

/* ---------- eventos ---------- */
const nul=v=>(v===''||v==null?null:v);
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-flt],[data-vercli],[data-mes],[data-pfl],[data-mcta]');if(!t)return;const d=t.dataset;
  if(d.tab)return ir(d.tab);
  if(d.mes&&t.tagName==='TH'){V.mes=+d.mes;return ir('mes');}
  if(d.mm){V.mes=Math.min(12,Math.max(1,V.mes+ +d.mm));return render();}
  if(d.cerrar)return cerrar();
  if(d.flt!==undefined){V.lib.cli=d.flt;V.lib.est='';return ir('libro');}
  if(d.vercli!==undefined){V.lib.cli=d.vercli;return ir('libro');}
  if(d.sort){V.lib.dir=V.lib.sort===d.sort?-V.lib.dir:1;V.lib.sort=d.sort;return render();}
  if(d.csort){V.cl.dir=V.cl.sort===d.csort?-V.cl.dir:-1;V.cl.sort=d.csort;return render();}
  if(d.limpia){V.lib={q:'',cli:'',serie:'',trim:'',est:'',sort:'fecha',dir:-1};return render();}
  if(d.cobrar!==undefined)return abrirCobro(d.cobrar,d.cli);
  if(d.wall){W.sel=new Set(pendCli(W.cli).map(f=>f.num));return cuerpoCobro();}
  if(d.wnone){W.sel=new Set();return cuerpoCobro();}
  if(d.wok)return confirmarCobro();
  if(d.delc!==undefined){if(confirm('¿Anular este cobro? La factura volverá a tener ese importe pendiente.')){if(await guardar(()=>dbDel('cont_cobros',S.cobros[+d.delc].id)))render();}return;}
  if(d.addg)return formGasto();
  if(d.addo)return formOtro();
  if(d.addf)return formFactura();
  if(d.delg!==undefined){if(await guardar(()=>dbDel('cont_gastos',S.gastos[+d.delg].id)))render();return;}
  if(d.delo!==undefined){if(await guardar(()=>dbDel('cont_otros_ingresos',S.otros[+d.delo].id)))render();return;}
  if(d.copynom){const act=S.trab.filter(w=>activoEnMes(w,V.mes)&&!S.nom.some(n=>n.mes===V.mes&&n.trabId===w.id));
    if(act.length&&await guardar(()=>dbIns('cont_nominas',act.map(w=>({anyo:ANYO,mes:V.mes,trabajador_id:w.id,base:w.base,extras:w.extras})))))render();return;}
  if(d.pquita){V.pend.cli='';return render();}
  if(d.pfl!==undefined){V.pend.cli=d.pfl;return render();}
  if(d.addt!==undefined)return formTarifa(d.addt);
  if(d.okt){const n=$('tn').value.trim(),p=Math.min(100,Math.max(0,+$('tp').value));if(!n)return;
    const ok=await guardar(async()=>{const {error}=await client.from('cont_tarifas').upsert({cliente:n,pct_montaje:p/100,origen:'añadida a mano'},{onConflict:'cliente'});if(error)throw error;});if(ok){cerrar();render();}return;}
  if(d.newt)return formTrab();
  if(d.oknt){const n=$('nn').value.trim(),a=$('na').value;if(!n)return;
    const ok=await guardar(async()=>{const [w]=await dbIns('cont_trabajadores',{nombre:n,soporta:$('ns').value,nomina_base:+$('nb').value||0,extras:+$('ne').value||0,fecha_alta:nul(a)});
      const desde=a?mesDe(a):1,filas=[];for(let m=desde;m<=12;m++)if(S.nom.some(x=>x.mes===m))filas.push({anyo:ANYO,mes:m,trabajador_id:w.id,base:w.nomina_base,extras:w.extras});
      if(filas.length)await dbIns('cont_nominas',filas);});
    if(ok){cerrar();render();}return;}
  if(d.baja!==undefined)return formBaja(+d.baja);
  if(d.okbaja!==undefined){const w=S.trab[+d.okbaja],f=$('bf').value;if(!f)return;const mb=mesDe(f);
    const ok=await guardar(async()=>{await dbUpd('cont_trabajadores',w.id,{fecha_baja:f,motivo_baja:nul($('bm').value)});
      for(const n of S.nom.filter(n=>n.trabId===w.id&&n.mes>mb))await dbDel('cont_nominas',n.id);});
    if(ok){cerrar();render();}return;}
  if(d.reac!==undefined){const w=S.trab[+d.reac];if(await guardar(()=>dbUpd('cont_trabajadores',w.id,{fecha_baja:null,motivo_baja:null})))render();return;}
  if(d.adel)return formAdel();
  if(d.okadel){const imp=+$('ad3').value,f=$('ad2').value;if(!imp||!f)return;const w=S.trab.find(x=>x.nombre===$('ad1').value);
    const ok=await guardar(()=>dbIns('cont_adelantos',{anyo:ANYO,mes:mesDe(f),trabajador_id:w.id,fecha:f,importe:imp,metodo:$('ad4').value}));if(ok){cerrar();render();}return;}
  if(d.deladel!==undefined){if(await guardar(()=>dbDel('cont_adelantos',S.adelantos[+d.deladel].id)))render();return;}
  if(d.mcta){V.my.cta=d.mcta;V.my.vista='mayor';return render();}
  if(d.okg){const imp=+$('gi').value;if(!imp)return;const fila={anyo:ANYO,mes:V.mes,fecha:nul($('gf').value),concepto:$('gc').value,proveedor:$('gp').value,categoria:$('gk').value,soporta:$('gs').value,importe:imp};
    if($('gv').value!=='auto')fila.iva_pct=+$('gv').value;
    if(await guardar(()=>dbIns('cont_gastos',fila))){cerrar();render();}return;}
  if(d.oko){const imp=+$('oi').value;if(!imp)return;
    if(await guardar(()=>dbIns('cont_otros_ingresos',{anyo:ANYO,mes:V.mes,cliente:$('oc').value,concepto:$('oo').value,fecha:nul($('of').value),cobra:$('ob').value,reparto:$('or').value,importe:imp}))){cerrar();render();}return;}
  if(d.okf){const total=+$('ft').value,num=$('fn').value.trim(),cli=$('fc').value,f=$('ff').value;
    if(!total||!f||!/^\d+-\d+$/.test(num)){alert('Escribe el nº como serie-número (ej. 2-150), la fecha y el total.');return;}
    if(S.facturas.some(x=>x.num===num)){alert('Ya existe una factura con el número '+fnum(num)+'.');return;}
    const [serie,numero]=num.split('-');
    if(await guardar(()=>dbIns('cont_facturas',{anyo:ANYO,serie,numero:+numero,titular:serie==='3'?'José':'Arturo',cliente:cli,fecha:f,concepto:$('fo').value,total,montaje:total*pctM(cli),reparto_auto:true}))){cerrar();render();}return;}
});
document.addEventListener('change',async e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='selanyo')return cambiarAnyo(+t.value);
  if(t.id==='selmes'){V.mes=+t.value;return render();}
  if(t.id==='lcli'){V.lib.cli=t.value;return render();} if(t.id==='lserie'){V.lib.serie=t.value;return render();}
  if(t.id==='ltrim'){V.lib.trim=t.value;return render();} if(t.id==='lest'){V.lib.est=t.value;return render();}
  if(t.id==='pcli'){V.pend.cli=t.value;return render();}
  if(t.id==='liqd'){const v=+t.value;if(await guardar(async()=>{const {error}=await client.from('cont_config').upsert({anyo:ANYO,liq_desde:v},{onConflict:'anyo'});if(error)throw error;}))render();return;}
  if(t.id==='ptr'){V.pers.t=t.value;return render();}
  if(t.id==='ivatit'){V.iva.tit=t.value;return render();}
  if(t.id==='mytit'){V.my.tit=t.value;return render();} if(t.id==='myvista'){V.my.vista=t.value;return render();} if(t.id==='mycta'){V.my.cta=t.value;return render();}
  if(t.id==='cmes'){V.cob.mes=t.value;return render();}
  if(t.id==='wcli'){W.cli=t.value;W.sel=new Set();W.imp='';return cuerpoCobro();}
  if(d.wsel!==undefined){t.checked?W.sel.add(d.wsel):W.sel.delete(d.wsel);return prevCobro();}
  if(t.id==='wforma'){W.forma=t.value;} if(t.id==='wfecha'){W.fecha=t.value;}
  if(d.tar){const v=Math.min(100,Math.max(0,+t.value));if(await guardar(async()=>{const {error}=await client.from('cont_tarifas').update({pct_montaje:v/100}).eq('cliente',d.tar);if(error)throw error;}))render();return;}
  if(d.trab!==undefined){const w=S.trab[+d.trab];const col={base:'nomina_base',extras:'extras'}[d.k];await guardar(()=>dbUpd('cont_trabajadores',w.id,{[col]:+t.value}));return;}
  if(d.nom!==undefined){const n=S.nom[+d.nom];const col={base:'base',extras:'extras',rec:'recogidas',sab:'sabados'}[d.k];if(await guardar(()=>dbUpd('cont_nominas',n.id,{[col]:+t.value})))render();return;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='lq'){V.lib.q=t.value;const p=t.selectionStart;render();const n=$('lq');n.focus();n.setSelectionRange(p,p);}
  if(t.id==='cq'){V.cob.q=t.value;const p=t.selectionStart;render();const n=$('cq');n.focus();n.setSelectionRange(p,p);}
  if(t.id==='wimp'){W.imp=t.value;prevCobro();}
  if(t.id==='gi'||t.id==='gv'||t.id==='gk')gprev();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});

async function iniciar(){
  const {data:{user}}=await client.auth.getUser();
  if(!user){location.href='login.html';return;}
  const {data:st}=await client.from('staff').select('*').eq('user_id',user.id).maybeSingle();
  const main=document.getElementById('main');
  if(!st||!st.acceso_finanzas||st.solo_montajes||st.solo_deca){main.innerHTML='<div class="box vacio"><b>No tienes acceso a Contabilidad.</b><br>Solo pueden verla Arturo y José. <a href="inicio.html">Volver al inicio</a></div>';return;}
  try{await recargar();}
  catch(err){console.error(err);main.innerHTML='<div class="box vacio"><b>No se han podido cargar los datos de contabilidad.</b><br>'+esc(err.message||err)+'<br><br>Si es la primera vez: falta ejecutar en Supabase los SQL <b>90</b> y <b>91</b>.</div>';return;}
  render();
}
iniciar();
</script>
</body>
</html>
