<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMMA - Mi tienda</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#2563eb;--bg:#f5f6fa;--card:#fff;--border:#e2e4eb;--text:#1f2430;--muted:#6b7280;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
button{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;}
button.secondary{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd;font-weight:600;}
input,select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;}
#toolbar{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
#toolbar .spacer{flex:1;} #toolbar b{color:#1e3a8a;font-size:15px;margin-right:8px;}
.tabs{display:flex;gap:2px;padding:12px 24px 0;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap;}
.tab{background:none;color:var(--muted);padding:10px 16px;font-weight:600;border-radius:0;border-bottom:2px solid transparent;}
.tab.activa{color:var(--primary);border-bottom-color:var(--primary);}
.panel{display:none;padding:20px 24px;} .panel.activa{display:block;}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:18px;}
.tarjeta{background:var(--card);border:1px solid #bfdbfe;border-left:5px solid #2563eb;border-radius:8px;padding:14px 16px;}
.tarjeta .n{font-size:28px;font-weight:700;color:#1e3a8a;} .tarjeta .t{font-size:13px;color:var(--muted);}
.tarjeta.aviso{border-left-color:#d97706;background:#fffbeb;}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid #bfdbfe;font-size:13px;}
th{background:#dbeafe;color:#1e3a8a;text-align:left;padding:9px 8px;} td{padding:8px;border-top:1px solid #dbeafe;}
tr.bloq td:first-child{border-left:5px solid #d97706;}
.muted{color:var(--muted);font-size:13px;}
button.on{background:#1e40af;color:#fff;border:1px solid #1e3a8a;font-weight:600;}
tr.fila{cursor:pointer;} tr.fila:hover td{background:#eff6ff;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:30;}
#det{display:none;position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--card);border-left:1px solid var(--border);z-index:31;padding:20px;overflow-y:auto;}
.k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;} .v{font-size:14px;margin:2px 0 10px;}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.fotos img,.firma img{width:100%;border:1px solid var(--border);border-radius:6px;background:#fafbfe;}
.ok{color:#15803d;font-weight:700;}
.caja{background:var(--card);border:1px dashed #93c5fd;border-radius:8px;padding:14px;margin-bottom:14px;}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ALMMA"><script src="pwa.js" defer></script>
</head>
<body>
<div id="toolbar">
  <b>ALMMA · <span id="tienda_nombre">Mi tienda</span></b>
  <button class="secondary" onclick="location.href='mis-pedidos.html'">Nuevo pedido</button>
  <div class="spacer"></div>
  <select id="t_sel" style="display:none" onchange="cambiaTienda()"></select>
  <span id="quien" class="muted"></span>
  <button class="secondary" onclick="logout()">Salir</button>
</div>
<div class="tabs">
  <button class="tab activa" data-t="ordenes">Órdenes de la tienda</button>
  <button class="tab" data-t="facturas">Facturas</button>
  <button class="tab" data-t="montajes">Montajes</button>
  <button class="tab" data-t="equipo">Mi equipo</button>
</div>

<div class="panel activa" id="p_ordenes">
  <div class="barra"><input id="o_buscar" placeholder="Buscar cliente, referencia, nº..." oninput="pintarOrdenes()" style="width:320px">
  <label class="muted"><input type="checkbox" id="o_antiguas" onchange="cargarOrdenes()"> Incluir años anteriores</label>
  <span class="muted">Desde</span> <input type="date" id="o_d" onchange="cargarOrdenes()"> <span class="muted">hasta</span> <input type="date" id="o_h" onchange="cargarOrdenes()"> <button class="secondary" onclick="limpiarFechas('o')">Quitar fechas</button></div>
  <div id="o_tabla"><span class="muted">Cargando...</span></div>
</div>

<div class="panel" id="p_facturas">
  <div class="barra"><input id="f_buscar" placeholder="Buscar nº de factura..." oninput="pintarFacturas()" style="width:260px">
  <span class="muted">Desde</span> <input type="date" id="f_d" onchange="cargarFacturas()"> <span class="muted">hasta</span> <input type="date" id="f_h" onchange="cargarFacturas()"> <button class="secondary" onclick="limpiarFechas('f')">Quitar fechas</button></div>
  <div id="f_tabla"><span class="muted">Cargando...</span></div>
</div>

<div class="panel" id="p_montajes">
  <div class="barra">
    <button id="m_b_prox" class="on" onclick="modoMontajes('prox')">Próximos montajes</button>
    <button id="m_b_pas" class="secondary" onclick="modoMontajes('pas')">Montajes realizados</button>
    <input id="m_buscar" placeholder="Buscar cliente, referencia, localidad..." oninput="pintarMontajes()" style="width:300px">
    <span class="muted">Desde</span> <input type="date" id="m_d" onchange="cargarMontajes()"> <span class="muted">hasta</span> <input type="date" id="m_h" onchange="cargarMontajes()"> <button class="secondary" onclick="limpiarFechas('m')">Quitar fechas</button>
    <label class="muted" id="m_l_ant" style="display:none"><input type="checkbox" id="m_ant" onchange="cargarMontajes()"> Incluir años anteriores</label>
  </div>
  <div id="m_tabla"><span class="muted">Cargando...</span></div>
</div>
<div id="overlay" onclick="cerrarMontaje()"></div>
<div id="det"><div class="barra"><b id="det_t" style="font-size:16px"></b><span style="flex:1"></span><button class="secondary" onclick="cerrarMontaje()">Cerrar</button></div><div id="det_c"></div></div>

<div class="panel" id="p_equipo">
  <div class="caja"><b>Nuevo dependiente</b>
    <div class="barra" style="margin-top:8px">
      <input id="n_nombre" placeholder="Nombre"><input id="n_email" type="email" placeholder="Email">
      <input id="n_pass" placeholder="Contraseña (mín. 10)"><button onclick="crearDep()">Crear cuenta</button></div>
    <span class="muted">Cada dependiente verá solo los pedidos que haga él.</span></div>
  <div id="e_tabla"><span class="muted">Cargando...</span></div>
</div>

<script>
const client = supabase.createClient("https://uamgbtbsxbrgymhqalak.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWdidGJzeGJyZ3ltaHFhbGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTMyOTIsImV4cCI6MjA5OTg4OTI5Mn0.0OClM8yZmfkiXynOkGLQiLRX-XZjkkP63z5UfIgck8k");
let ordenes = [], misTiendas = [], tiendaSel = "";
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => Number(n||0).toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
async function logout(){ await client.auth.signOut(); location.href = "login.html"; }
document.querySelectorAll(".tab[data-t]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab[data-t]").forEach(x => x.classList.toggle("activa", x === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("activa", p.id === "p_" + b.dataset.t));
});

async function iniciar(){
  const { data:{ user } } = await client.auth.getUser();
  if (!user) { location.href = "login.html"; return; }
  const { data: d, error: errD } = await client.from("dependientes").select("nombre, es_admin_tienda, tienda_id").eq("user_id", user.id).maybeSingle();
  if (errD) { document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;font-family:sans-serif"><h3>No se pudo abrir tu cuenta</h3><p>Error: ' + String(errD.message).replace(/[<>&]/g, "") + '</p><button onclick="logout()">Volver al inicio de sesión</button></div>'; return; }
  if (!d || !d.es_admin_tienda) { location.href = "mis-pedidos.html"; return; }
  const { data: ts } = await client.from("tiendas").select("id, nombre").order("nombre");
  misTiendas = ts || [];
  document.getElementById("tienda_nombre").textContent = (misTiendas.find(x => x.id === d.tienda_id) || {}).nombre || "Mi tienda";
  if (misTiendas.length > 1) {
    document.getElementById("tienda_nombre").textContent = "Mis tiendas";
    const sel = document.getElementById("t_sel"); sel.style.display = "";
    sel.innerHTML = '<option value="">Todas mis tiendas</option>' + misTiendas.map(t => '<option value="'+t.id+'">'+esc(t.nombre)+'</option>').join("");
  }
  document.getElementById("quien").textContent = d.nombre || user.email;
  cargarOrdenes(); cargarFacturas(); cargarMontajes(); cargarEquipo();
}
function cambiaTienda(){ tiendaSel = document.getElementById("t_sel").value; cargarOrdenes(); cargarFacturas(); cargarMontajes(); cargarEquipo(); }
const multi = () => misTiendas.length > 1;

/* Fechas de los buscadores: p = "o" (órdenes), "f" (facturas), "m" (montajes) */
function fechas(p){ return [document.getElementById(p+"_d").value, document.getElementById(p+"_h").value]; }
function sumaDia(f){ const d = new Date(f+"T00:00:00"); d.setDate(d.getDate()+1); return iso(d); }
function limpiarFechas(p){ document.getElementById(p+"_d").value = ""; document.getElementById(p+"_h").value = ""; ({o:cargarOrdenes,f:cargarFacturas,m:cargarMontajes})[p](); }

/* Órdenes */
let conMensaje = new Set();
async function cargarConMensaje() {
  const { data } = await client.rpc("ordenes_con_chat_sin_leer");
  conMensaje = new Set((data || []).map(r => r.anyo + "/" + r.orden));
}
const globo = (a, o) => conMensaje.has(a + "/" + o) ? ' <span title="Mensaje sin leer en el chat" style="background:#dc2626;color:#fff;border-radius:10px;padding:0 6px;font-size:11px">💬</span>' : "";

async function cargarOrdenes(){
  let q = client.from("ordenes").select("anyo, orden, nombre_cli, num_pedido, estado, fecha_creacion, tiendas(nombre)")
    .order("anyo",{ascending:false}).order("orden",{ascending:false}).limit(1000);
  if (tiendaSel) q = q.eq("tienda_id", tiendaSel);
  const [od, oh] = fechas("o");
  if (od) q = q.gte("fecha_creacion", od);
  if (oh) q = q.lt("fecha_creacion", sumaDia(oh));
  if (!od && !oh && !document.getElementById("o_antiguas").checked) q = q.gte("anyo", new Date().getFullYear()-3);
  const [{ data, error }] = await Promise.all([q, cargarConMensaje()]);
  if (error) { document.getElementById("o_tabla").innerHTML = '<span class="muted">Error: '+esc(error.message)+'</span>'; return; }
  ordenes = data; pintarOrdenes();
}
function pintarOrdenes(){
  const b = document.getElementById("o_buscar").value.trim().toLowerCase();
  const f = ordenes.filter(o => !b || [o.nombre_cli,o.num_pedido,o.anyo+"/"+o.orden].join(" ").toLowerCase().includes(b)).slice(0,500);
  document.getElementById("o_tabla").innerHTML = '<table><tr><th>Orden</th>'+(multi()?'<th>Tienda</th>':'')+'<th>Cliente</th><th>Referencia</th><th>Estado</th><th>Creada</th></tr>'+
    f.map(o => '<tr><td><a href="orden_tienda.html?anyo='+o.anyo+'&orden='+o.orden+'">'+o.anyo+'/'+o.orden+'</a>'+globo(o.anyo,o.orden)+'</td>'+(multi()?'<td>'+esc(o.tiendas?.nombre)+'</td>':'')+'<td>'+esc(o.nombre_cli)+'</td><td>'+esc(o.num_pedido)+'</td><td>'+esc((o.estado||"").replace(/_/g," "))+'</td><td>'+(o.fecha_creacion?new Date(o.fecha_creacion).toLocaleDateString("es-ES"):"")+'</td></tr>').join("")+'</table>'+
    '<div class="muted" style="margin-top:6px">'+f.length+' órdenes'+(ordenes.length>500?' (se muestran las 500 primeras; afina con el buscador)':'')+'</div>';
}

/* Facturas */
let facturas = [];
async function cargarFacturas(){
  let q = client.from("cabfacturas").select("anyo, serie, factura, ffactura, impbruto, impiva, impneto, tiendas!tienda_id(nombre)")
    .order("ffactura",{ascending:false}).limit(1000);
  if (tiendaSel) q = q.eq("tienda_id", tiendaSel);
  const [fd_, fh] = fechas("f");
  if (fd_) q = q.gte("ffactura", fd_);
  if (fh) q = q.lt("ffactura", sumaDia(fh));
  const { data, error } = await q;
  if (error) { document.getElementById("f_tabla").innerHTML = '<span class="muted">Error: '+esc(error.message)+'</span>'; return; }
  facturas = data; pintarFacturas();
}
function pintarFacturas(){
  const b = document.getElementById("f_buscar").value.trim().toLowerCase();
  const data = facturas.filter(f => !b || (f.serie+"-"+f.anyo+"/"+f.factura).toLowerCase().includes(b)).slice(0,500);
  document.getElementById("f_tabla").innerHTML = data.length ? '<table><tr><th>Factura</th>'+(multi()?'<th>Tienda</th>':'')+'<th>Fecha</th><th>Base</th><th>IVA</th><th>Total</th><th></th></tr>'+
    data.map(f => { const n = f.anyo+'-'+f.serie+'-'+f.factura; return '<tr><td>'+f.serie+'-'+f.anyo+'/'+f.factura+'</td>'+(multi()?'<td>'+esc(f.tiendas?.nombre)+'</td>':'')+'<td>'+(f.ffactura?new Date(f.ffactura).toLocaleDateString("es-ES"):"")+'</td><td>'+eur(f.impbruto)+'</td><td>'+eur(f.impiva)+'</td><td>'+eur(f.impneto)+'</td><td><a href="factura_imprimir.html?ids='+n+'" target="_blank">Ver / imprimir</a></td></tr>'; }).join("")+'</table>'
    : '<span class="muted">No hay facturas'+(facturas.length?' con ese filtro':' todavía')+'.</span>';
}

/* Montajes (antes en montajes_tienda.html) */
let montajes = [], vistaM = "prox";
const fdM = d => d ? new Date(d).toLocaleDateString("es-ES") : "—";
function modoMontajes(m){
  vistaM = m;
  document.getElementById("m_b_prox").className = m==="prox" ? "on" : "secondary";
  document.getElementById("m_b_pas").className = m==="pas" ? "on" : "secondary";
  document.getElementById("m_l_ant").style.display = m==="pas" ? "" : "none";
  cargarMontajes();
}
async function cargarMontajes(){
  const cont = document.getElementById("m_tabla"); cont.innerHTML = '<span class="muted">Cargando...</span>';
  let q = client.from("ordenes").select("anyo, orden, nombre_cli, domicilio_cli, localidad_cli, num_pedido, estado, fecha_prev_montaje, horamont, fecha_montaje, tiendas(nombre)").limit(500);
  if (tiendaSel) q = q.eq("tienda_id", tiendaSel);
  const [md, mh] = fechas("m");
  if (vistaM === "prox") {
    q = q.neq("estado", "completado").order("fecha_prev_montaje");
    q = q.gte("fecha_prev_montaje", md || new Date().toISOString().slice(0,10));
    if (mh) q = q.lte("fecha_prev_montaje", mh);
  } else {
    q = q.not("fecha_montaje", "is", null).order("fecha_montaje", { ascending:false });
    if (md) q = q.gte("fecha_montaje", md);
    if (mh) q = q.lt("fecha_montaje", sumaDia(mh));
    if (!md && !mh && !document.getElementById("m_ant").checked) q = q.gte("anyo", new Date().getFullYear() - 3);
  }
  const { data, error } = await q;
  if (error) { cont.innerHTML = '<span class="muted">Error: '+esc(error.message)+'</span>'; return; }
  montajes = data; pintarMontajes();
}
function pintarMontajes(){
  const b = document.getElementById("m_buscar").value.trim().toLowerCase();
  const l = montajes.filter(o => !b || [o.nombre_cli,o.num_pedido,o.localidad_cli,o.anyo+"/"+o.orden].join(" ").toLowerCase().includes(b));
  const fecha = vistaM === "prox" ? "Montaje previsto" : "Montaje realizado";
  document.getElementById("m_tabla").innerHTML = l.length ? '<table><tr><th>'+fecha+'</th><th>Orden</th>'+(multi()?'<th>Tienda</th>':'')+'<th>Cliente</th><th>Localidad</th><th>Referencia</th><th>Estado</th></tr>'+
    l.map(o => '<tr class="fila" onclick="abrirMontaje('+montajes.indexOf(o)+')"><td><b>'+(vistaM==="prox" ? fdM(o.fecha_prev_montaje) + (o.horamont ? " · "+esc(o.horamont) : "") : new Date(o.fecha_montaje).toLocaleString("es-ES"))+'</b></td><td>'+o.anyo+'/'+o.orden+'</td>'+(multi()?'<td>'+esc(o.tiendas?.nombre)+'</td>':'')+'<td>'+esc(o.nombre_cli)+'</td><td>'+esc(o.localidad_cli)+'</td><td>'+esc(o.num_pedido)+'</td><td>'+esc((o.estado||"").replace(/_/g," "))+'</td></tr>').join("")+'</table>'
    : '<span class="muted">'+(vistaM==="prox" ? "No hay montajes próximos." : "No hay montajes realizados con ese filtro.")+'</span>';
}
function cerrarMontaje(){ document.getElementById("det").style.display = "none"; document.getElementById("overlay").style.display = "none"; }
async function urlAdjunto(path){ const { data } = await client.storage.from("ordenes-adjuntos").createSignedUrl(path, 600); return data?.signedUrl || ""; }
async function abrirMontaje(i){
  const o = montajes[i]; document.getElementById("det").style.display = "block"; document.getElementById("overlay").style.display = "block";
  document.getElementById("det_t").textContent = "Orden " + o.anyo + "/" + o.orden;
  const c = document.getElementById("det_c"); c.innerHTML = '<span class="muted">Cargando...</span>';
  const [en, fo, li] = await Promise.all([
    client.from("entregas").select("firmante_nombre, firmado_at, firma_storage_path, observaciones").eq("anyo", o.anyo).eq("orden", o.orden).order("firmado_at", { ascending:false }),
    client.from("fotos_orden").select("storage_path, categoria, comentario, created_at").eq("anyo", o.anyo).eq("orden", o.orden).order("created_at"),
    client.from("linorden").select("linea, tipolinea, descripcion, cantidad").neq("tipolinea", 4).eq("anyo", o.anyo).eq("orden", o.orden).order("linea")
  ]);
  const ents = await Promise.all((en.data || []).map(async e => ({ ...e, u: await urlAdjunto(e.firma_storage_path) })));
  const fots = await Promise.all((fo.data || []).map(async f => ({ ...f, u: await urlAdjunto(f.storage_path) })));
  const k = (a,b) => '<div class="k">'+a+'</div><div class="v">'+(b || "—")+'</div>';
  c.innerHTML = k("Cliente", esc(o.nombre_cli)) + k("Dirección", esc([o.domicilio_cli,o.localidad_cli].filter(Boolean).join(" - "))) +
    k("Montaje previsto", fdM(o.fecha_prev_montaje) + (o.horamont ? " · " + esc(o.horamont) : "")) +
    k("Montaje realizado", o.fecha_montaje ? '<span class="ok">'+new Date(o.fecha_montaje).toLocaleString("es-ES")+'</span>' : "Aún no realizado") +
    '<div class="k">Artículos</div><div class="v">'+((li.data||[]).map(l => (l.cantidad ?? "")+" × "+esc(l.descripcion)).join("<br>") || "—")+'</div>' +
    '<div class="k">Firma del cliente</div>' + (ents.length ? ents.map(e => '<div class="firma v">'+(e.u ? '<img src="'+e.u+'" alt="Firma" style="max-width:360px">' : '')+'<div class="muted">'+esc(e.firmante_nombre || "")+' · '+new Date(e.firmado_at).toLocaleString("es-ES")+(e.observaciones ? '<br>'+esc(e.observaciones) : '')+'</div></div>').join("") : '<div class="v muted">Sin firma todavía.</div>') +
    '<div class="k">Fotos</div>' + (fots.length ? '<div class="fotos">'+fots.map(f => '<a href="'+f.u+'" target="_blank"><img src="'+f.u+'" alt="'+esc(f.categoria||"foto")+'"><div class="muted">'+esc(f.categoria||"")+' '+esc(f.comentario||"")+'</div></a>').join("")+'</div>' : '<div class="v muted">Sin fotos.</div>');
}

/* Mi equipo (usa la función admin-usuarios, limitada a tu tienda) */
async function llamar(cuerpo){
  const { data, error } = await client.functions.invoke("admin-usuarios", { body: cuerpo });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch(_){} return { error: m }; }
  return data;
}
async function cargarEquipo(){
  const r = await llamar({ accion:"listar" });
  if (r.error) { document.getElementById("e_tabla").innerHTML = '<span class="muted">Error: '+esc(r.error)+'</span>'; return; }
  document.getElementById("e_tabla").innerHTML = '<table><tr><th>Nombre</th><th>Email</th><th>Tipo</th>'+(multi()?'<th>Tienda</th>':'')+'<th>Último acceso</th><th>Estado</th><th></th></tr>'+
    r.usuarios.filter(x => !tiendaSel || x.tienda_id === tiendaSel).map(x => '<tr class="'+(x.bloqueado?'bloq':'')+'"><td>'+esc(x.nombre)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.tipo)+'</td>'+(multi()?'<td>'+esc(x.tienda)+'</td>':'')+'<td>'+(x.ultimo_acceso?new Date(x.ultimo_acceso).toLocaleString("es-ES"):"Nunca")+'</td><td>'+(x.bloqueado?"Bloqueado":"Activo")+'</td><td>'+(x.tipo==="Dependiente"?'<button class="secondary" onclick="bloqueo(\''+x.user_id+'\','+x.bloqueado+')">'+(x.bloqueado?"Desbloquear":"Bloquear")+'</button> <button class="secondary" onclick="pass(\''+x.user_id+'\')">Contraseña</button>':'')+'</td></tr>').join("")+'</table>';
}
async function bloqueo(id, b){ if(!b && !confirm("¿Bloquear esta cuenta?")) return; const r = await llamar({accion:b?"desbloquear":"bloquear",user_id:id}); if(r.error) alert(r.error); else cargarEquipo(); }
async function pass(id){ const p = prompt("Nueva contraseña (mínimo 10 caracteres):"); if(!p) return; const r = await llamar({accion:"password",user_id:id,password:p}); alert(r.error||"Contraseña cambiada."); }
async function crearDep(){
  if (multi() && !tiendaSel) { alert("Elige arriba la tienda concreta en la que crear el dependiente."); return; }
  const r = await llamar({ accion:"crear", tipo:"dependiente", tienda_id: tiendaSel || undefined, nombre:document.getElementById("n_nombre").value, email:document.getElementById("n_email").value, password:document.getElementById("n_pass").value });
  if (r.error) { alert(r.error); return; }
  ["n_nombre","n_email","n_pass"].forEach(i => document.getElementById(i).value = ""); cargarEquipo();
}
iniciar();

// --- banner de mensajes sin leer (migracion/61_chat_ordenes_sin_leer.sql) ---
(function () {
  const enStaff = location.pathname.endsWith("pedidos.html");
  const enlace = (a, o) => (enStaff ? "pedidos.html" : "orden_tienda.html") + "?anyo=" + a + "&orden=" + o;
  async function pintarBanner() {
    const { data, error } = await client.rpc("ordenes_con_chat_sin_leer");
    let b = document.getElementById("banner_mensajes");
    if (error || !data || !data.length) { if (b) b.remove(); return; }
    if (!b) {
      b = document.createElement("div"); b.id = "banner_mensajes";
      b.style.cssText = "position:sticky;top:0;z-index:9999;background:#dc2626;color:#fff;padding:9px 16px;font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;text-align:center";
      document.body.prepend(b);
    }
    const orden = data.slice().sort((x, y) => y.anyo - x.anyo || y.orden - x.orden);
    b.innerHTML = "💬 MENSAJES SIN LEER (" + orden.length + (orden.length === 1 ? " orden" : " órdenes") + "): " +
      orden.slice(0, 8).map(r => '<a style="color:#fff;text-decoration:underline;margin:0 6px" href="' + enlace(r.anyo, r.orden) + '">' + r.anyo + "/" + r.orden + "</a>").join("") +
      (orden.length > 8 ? " y " + (orden.length - 8) + " más" : "");
  }
  pintarBanner(); setInterval(pintarBanner, 60000);
})();
</script>
