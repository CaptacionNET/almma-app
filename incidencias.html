<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMMA - Gestión de Incidencias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

:root{--primary:#2563eb;--bg:#f5f6fa;--card:#fff;--border:#e2e4eb;--text:#1f2430;--muted:#6b7280;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
button{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;}
button:hover{opacity:.9;}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
input,select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;}

#menubar{background:#1f2430;color:#e5e7eb;display:flex;align-items:center;padding:0 12px;font-size:13px;position:relative;z-index:20;}
#menubar .brand{font-weight:700;color:#fff;padding:10px 16px 10px 0;font-size:15px;}
.menu-item{position:relative;}
.menu-item > span{display:block;padding:10px 14px;cursor:pointer;}
.menu-item:hover > span, .menu-item.abierto > span{background:#374151;}
.menu-drop{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--text);min-width:220px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);border-radius:0 0 8px 8px;overflow:hidden;}
.menu-item.abierto .menu-drop{display:block;}
.menu-drop a{display:block;padding:10px 16px;color:var(--text);text-decoration:none;font-size:13px;border-bottom:1px solid var(--border);}
.menu-drop a:hover{background:var(--bg);}
#toolbar{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
#toolbar .spacer{flex:1;}


.barra{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:16px 24px;}
.campo-mini label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;}
.campo-mini input,.campo-mini select{width:100%;}
.aviso{padding:0 24px;color:var(--muted);font-size:13px;}
#lista{padding:0 24px 40px;}
.inc{background:#fff;border:1px solid var(--border);border-left:6px solid #dc2626;border-radius:8px;padding:14px 16px;margin-bottom:14px;break-inside:avoid;page-break-inside:avoid;}
.inc.en_proceso{border-left-color:#d97706;} .inc.resuelta{border-left-color:#16a34a;}
.inc h3{margin:0 0 4px;font-size:16px;} .inc .meta{color:var(--muted);font-size:13px;margin-bottom:6px;}
.chip{display:inline-block;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;background:#fee2e2;color:#991b1b;margin-left:6px;}
.chip.en_proceso{background:#fef3c7;color:#92400e;} .chip.resuelta{background:#dcfce7;color:#166534;}
.desc{margin:8px 0;white-space:pre-wrap;}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.fotos figure{margin:0;width:170px;} .fotos img{width:170px;height:130px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
.fotos figcaption{font-size:11px;color:var(--muted);margin-top:2px;} .fotos .de-inc img{border:2px solid #dc2626;}
.acc{margin-top:10px;display:flex;gap:8px;} .acc button{padding:5px 12px;font-size:13px;}
#titulo_imp{display:none;padding:0 24px;}
@media print{
  #menubar,#toolbar,.barra,.aviso,.acc{display:none !important;}
  body{background:#fff;} #titulo_imp{display:block;}
  .inc{border:1px solid #999;border-left:6px solid #333;} .fotos img{width:150px;height:115px;}
}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ALMMA"><script src="pwa.js" defer></script>
</head>
<body>

<div id="menubar">
  <div class="brand">ALMMA</div>
  <div class="menu-item" data-menu="sistema">
    <span>Sistema</span>
    <div class="menu-drop">
      <a href="sistema.html?cat=tiendas">Tiendas</a>
      <a href="sistema.html?cat=fabricantes">Fabricantes</a>
      <a href="sistema.html?cat=dependientes">Dependientes</a>
      <a href="sistema.html?cat=montadores">Montadores</a>
      <a href="sistema.html?cat=articulos">Artículos</a>
    </div>
  </div>
  <div class="menu-item" data-menu="ordenes">
    <span>Ordenes de Trabajo</span>
    <div class="menu-drop">
      <a href="pedidos.html">Introducción/Consulta</a>
      <a href="punteo.html">Punteo de Ordenes</a>
      <a href="rutas.html">Listado de Rutas</a>
      <a href="#" onclick="proximamente('Realizar Montajes');return false;">Realizar Montajes</a>
      <a href="incidencias.html" class="activo-link">Gestión de Incidencias</a>
      <a href="#" onclick="proximamente('Contacto Cliente');return false;">Contacto Cliente</a>
    </div>
  </div>
  <div class="menu-item" data-menu="facturacion">
    <span>Facturación</span>
    <div class="menu-drop">
      <a href="facturas.html?tab=pendiente">Pendientes de facturar</a>
      <a href="facturas.html?tab=web">Facturas emitidas</a>
    </div>
  </div>
</div>

<div id="toolbar">
  <button class="secondary" onclick="window.location.href='inicio.html'">🏠 Inicio</button>
  <button class="secondary" onclick="window.location.href='pedidos.html'">Ordenes</button>
  <button class="secondary" onclick="window.location.href='recepcion.html'">Consulta almacén</button>
  <button class="secondary" onclick="window.location.href='entrada_albaranes.html'">Entrada por albarán</button>
  <button class="secondary" id="btn_modo_mont" style="display:none" onclick="window.location.href='mi-dia.html'">📱 Modo montador</button>
  <button class="secondary" onclick="window.location.href='deca.html'">DeCA</button>
  <button class="secondary" onclick="window.location.href='facturas.html'">Facturación</button>
  <button class="secondary" id="btn_admin" style="display:none" onclick="window.location.href='admin.html'">Administración</button>
  <div class="spacer"></div>
  <button class="secondary" onclick="logout()">Salir</button>
</div>

<div id="titulo_imp"><h2 style="margin:12px 0 2px">ALMMA — Incidencias</h2><div id="titulo_filtros" style="font-size:13px;color:#555"></div></div>
<div class="barra">
  <div class="campo-mini" style="max-width:120px"><label>Nº de orden</label><input id="f_orden" type="number" placeholder="p. ej. 1234"></div>
  <div class="campo-mini" style="max-width:100px"><label>Año de la orden</label><input id="f_anyo" type="number" placeholder="todos"></div>
  <div class="campo-mini" style="max-width:150px"><label>Aviso desde</label><input id="f_desde" type="date"></div>
  <div class="campo-mini" style="max-width:150px"><label>Aviso hasta</label><input id="f_hasta" type="date"></div>
  <div class="campo-mini" style="min-width:180px"><label>Cliente (contiene)</label><input id="f_cliente" type="text" placeholder="Nombre del cliente"></div>
  <div class="campo-mini" style="min-width:200px"><label>Tienda</label><select id="f_tienda"><option value="">Todas</option></select></div>
  <div class="campo-mini" style="max-width:160px"><label>Estado</label><select id="f_estado"><option value="activas">Abiertas y en proceso</option><option value="">Todas</option><option value="abierta">Abiertas</option><option value="en_proceso">En proceso</option><option value="resuelta">Resueltas</option></select></div>
  <button onclick="cargar()">Buscar</button>
  <button class="secondary" onclick="limpiar()">Limpiar</button>
  <button class="secondary" onclick="imprimir()">🖨 Imprimir</button>
</div>
<div class="aviso" id="aviso"></div>
<div id="lista"></div>

<script>
const client = supabase.createClient(
  "https://uamgbtbsxbrgymhqalak.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWdidGJzeGJyZ3ltaHFhbGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTMyOTIsImV4cCI6MjA5OTg4OTI5Mn0.0OClM8yZmfkiXynOkGLQiLRX-XZjkkP63z5UfIgck8k"
);
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => d ? new Date(d).toLocaleDateString("es-ES") : "";
const ETQ = { abierta:"Abierta", en_proceso:"En proceso", resuelta:"Resuelta" };
let tiendas = {};

document.querySelectorAll(".menu-item").forEach(item => {
  item.querySelector("span").addEventListener("click", e => {
    e.stopPropagation();
    const ya = item.classList.contains("abierto");
    document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("abierto"));
    if (!ya) item.classList.add("abierto");
  });
});
document.addEventListener("click", () => document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("abierto")));
function proximamente(n) { alert(`"${n}" todavía no está construido en la app nueva — próximamente.`); }
async function logout() { await client.auth.signOut(); window.location.href = "login.html"; }

async function iniciar() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) { location.href = "login.html"; return; }
  const { data: st } = await client.from("staff").select("es_admin, es_montador, solo_deca, solo_montajes").eq("user_id", user.id).maybeSingle();
  if (!st) { await client.auth.signOut(); location.href = "login.html"; return; }
  if (st.solo_deca) { location.href = "deca.html"; return; }
  if (st.solo_montajes) { location.href = "mi-dia.html"; return; }
  if (st.es_admin) $("btn_admin").style.display = "";
  if (st.es_montador) $("btn_modo_mont").style.display = "";
  const { data: ts } = await client.from("tiendas").select("id, nombre").order("nombre");
  (ts || []).forEach(t => { tiendas[t.id] = t.nombre; });
  let act = null;   // solo tiendas con pedidos en los últimos 2 años (SQL 103; sin él se ven todas)
  try { const r = await client.rpc("tiendas_activas", { p_anyo_desde: new Date().getFullYear() - 1 }); if (!r.error) act = new Set((r.data || []).map(x => x.id)); } catch (_) {}
  $("f_tienda").innerHTML = '<option value="">Todas</option>' + (ts || []).filter(t => !act || act.has(t.id)).map(t => '<option value="' + t.id + '">' + esc(t.nombre) + '</option>').join("");
  const q = new URLSearchParams(location.search);
  if (q.get("orden")) $("f_orden").value = q.get("orden");
  if (q.get("anyo")) $("f_anyo").value = q.get("anyo");
  cargar();
}

function limpiar() { ["f_orden","f_anyo","f_desde","f_hasta","f_cliente","f_tienda"].forEach(i => $(i).value = ""); $("f_estado").value = "activas"; cargar(); }

let ultimas = [];
async function cargar() {
  $("aviso").textContent = "Cargando…"; $("lista").innerHTML = "";
  let q = client.from("incidencias").select("id, anyo, orden, tipo, descripcion, estado, created_at, resuelto_at, ordenes(nombre_cli, domicilio_cli, localidad_cli, telefono_cli, tienda_id, fecha_prev_montaje, num_pedido)").order("created_at", { ascending:false }).limit(300);
  if ($("f_orden").value) q = q.eq("orden", +$("f_orden").value);
  if ($("f_anyo").value) q = q.eq("anyo", +$("f_anyo").value);
  if ($("f_desde").value) q = q.gte("created_at", $("f_desde").value);
  if ($("f_hasta").value) q = q.lt("created_at", new Date(new Date($("f_hasta").value + "T12:00:00").getTime() + 86400000).toISOString().slice(0, 10));
  const est = $("f_estado").value;
  if (est === "activas") q = q.in("estado", ["abierta", "en_proceso"]); else if (est) q = q.eq("estado", est);
  const { data, error } = await q;
  if (error) { $("aviso").textContent = "Error: " + error.message; return; }
  let lista = data || [];
  const cli = $("f_cliente").value.trim().toLowerCase(), tie = $("f_tienda").value;
  if (cli) lista = lista.filter(i => String(i.ordenes?.nombre_cli || "").toLowerCase().includes(cli));
  if (tie) lista = lista.filter(i => i.ordenes?.tienda_id === tie);
  // fotos de las órdenes implicadas (las de la incidencia y las demás que subió el montador)
  const porAnyo = {}; lista.forEach(i => (porAnyo[i.anyo] ||= new Set()).add(i.orden));
  const fotos = {};
  for (const [a, set] of Object.entries(porAnyo)) {
    const ords = [...set];
    for (let n = 0; n < ords.length; n += 100) {
      const { data: fs } = await client.from("fotos_orden").select("anyo, orden, incidencia_id, storage_path, categoria, comentario, created_at").eq("anyo", +a).in("orden", ords.slice(n, n + 100)).order("created_at");
      (fs || []).forEach(f => (fotos[f.anyo + "/" + f.orden] ||= []).push(f));
    }
  }
  lista.forEach(i => { i.fotos = fotos[i.anyo + "/" + i.orden] || []; });
  ultimas = lista;
  const rutas = [...new Set(lista.flatMap(i => i.fotos.map(f => f.storage_path)))], urls = {};
  for (let n = 0; n < rutas.length; n += 100) {
    const { data: su } = await client.storage.from("ordenes-adjuntos").createSignedUrls(rutas.slice(n, n + 100), 3600);
    (su || []).forEach(d => { if (d.signedUrl) urls[d.path] = d.signedUrl; });
  }
  $("aviso").textContent = lista.length + (lista.length === 1 ? " incidencia" : " incidencias") + (data && data.length === 300 ? " (se muestran las 300 más recientes: afina los filtros)" : "");
  $("lista").innerHTML = lista.map(i => {
    const o = i.ordenes || {};
    const dir = [o.domicilio_cli, o.localidad_cli].filter(Boolean).join(", ");
    const fs = i.fotos.map(f => '<figure class="' + (f.incidencia_id === i.id ? "de-inc" : "") + '">' + (urls[f.storage_path] ? '<img src="' + urls[f.storage_path] + '" alt="">' : "") +
      '<figcaption>' + (f.incidencia_id === i.id ? "⚠ Incidencia" : "Orden") + (f.comentario ? " · " + esc(f.comentario) : "") + ' · ' + fmt(f.created_at) + '</figcaption></figure>').join("");
    return '<div class="inc ' + i.estado + '"><h3>Orden ' + i.anyo + '/' + i.orden + ' — ' + esc(o.nombre_cli || "") + '<span class="chip ' + i.estado + '">' + ETQ[i.estado] + '</span></h3>' +
      '<div class="meta">Tienda: <b>' + esc(tiendas[o.tienda_id] || "—") + '</b>' + (o.num_pedido ? ' · Pedido ' + esc(o.num_pedido) : "") + (dir ? ' · ' + esc(dir) : "") + (o.telefono_cli ? ' · ☎ ' + esc(o.telefono_cli) : "") +
      '<br>Montaje previsto: ' + fmt(o.fecha_prev_montaje) + ' · Aviso: ' + fmt(i.created_at) + (i.resuelto_at ? ' · Resuelta: ' + fmt(i.resuelto_at) : "") + '</div>' +
      '<div><b>' + esc(i.tipo || "Incidencia") + '</b></div>' + (i.descripcion ? '<div class="desc">' + esc(i.descripcion) + '</div>' : "") +
      (fs ? '<div class="fotos">' + fs + '</div>' : '<div class="meta">Sin fotos.</div>') +
      '<div class="acc"><button class="secondary" onclick="location.href=\'pedidos.html?anyo=' + i.anyo + '&orden=' + i.orden + '\'">Abrir orden</button>' +
      (i.estado !== "resuelta" ? '<button onclick="cambiar(\'' + i.id + '\',\'' + (i.estado === "abierta" ? "en_proceso" : "resuelta") + '\')">' + (i.estado === "abierta" ? "Pasar a en proceso" : "Marcar resuelta") + '</button>' : "") + '</div></div>';
  }).join("") || '<div class="aviso">No hay incidencias con esos filtros.</div>';
}

async function cambiar(id, estado) {
  if (estado === "resuelta" && !confirm("Resolver la incidencia NO devuelve la orden a su estado anterior (eso se hace a mano en la orden). ¿Continuar?")) return;
  const { error } = await client.from("incidencias").update({ estado, resuelto_at: estado === "resuelta" ? new Date().toISOString() : null }).eq("id", id);
  if (error) { alert("No se ha podido cambiar: " + error.message); return; }
  cargar();
}

function imprimir() {
  const f = [];
  if ($("f_orden").value) f.push("orden " + $("f_orden").value);
  if ($("f_cliente").value) f.push("cliente «" + $("f_cliente").value + "»");
  if ($("f_tienda").value) f.push("tienda " + tiendas[$("f_tienda").value]);
  if ($("f_desde").value || $("f_hasta").value) f.push("avisos " + ($("f_desde").value || "…") + " a " + ($("f_hasta").value || "…"));
  $("titulo_filtros").textContent = (f.join(" · ") || "Todas") + " · impreso el " + new Date().toLocaleDateString("es-ES");
  window.print();
}
iniciar();
</script>
</body>
</html>
