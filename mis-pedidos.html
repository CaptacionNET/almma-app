<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMMA - Mis pedidos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.6.1/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.6.1/dist/js/tabulator.min.js"></script>
<style>
:root{--primary:#2563eb;--bg:#f5f6fa;--card:#fff;--border:#e2e4eb;--text:#1f2430;--muted:#6b7280;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
#topbar .brand{font-weight:700;font-size:18px;color:var(--primary);}
#topbar .brand small{display:block;font-size:12px;font-weight:400;color:var(--muted);}
button{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;}
button:hover{opacity:.9;}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
button:disabled{opacity:.6;cursor:default;}
input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin:24px;padding:20px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.campo label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
.campo input,.campo select,.campo textarea{width:100%;}
.estado-pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;display:inline-block;}
.estado-en_proceso{background:#eef2ff;color:#4338ca;}
.estado-recepcionado_parcial{background:#fef9c3;color:#a16207;}
.estado-recepcionado_total{background:#ecfeff;color:#0e7490;}
.estado-agendado{background:#f5f3ff;color:#6d28d9;}
.estado-completado{background:#f0fdf4;color:#15803d;}
.estado-incidencia{background:#fef2f2;color:#dc2626;}
.aviso-ok{display:none;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px;}
.error{display:none;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px;}
.tabla-scroll{margin:0 24px 24px;overflow-x:auto;}
.lineas-table{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px;}
.lineas-table th,.lineas-table td{border-bottom:1px solid var(--border);padding:6px 4px;text-align:left;}
.buscador-articulo{position:relative;}
.sugerencias{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 20px -10px rgba(0,0,0,.2);max-height:220px;overflow-y:auto;z-index:5;}
.sugerencias div{padding:8px 10px;cursor:pointer;font-size:13px;}
.sugerencias div:hover{background:#f5f6fa;}
#modal_nuevo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:10;}
#modal_nuevo .card{width:100%;max-width:640px;margin:0;}
/* --- listados con el formato de las líneas de la orden: cabecera azul, filas alternas y banda de color a la izquierda --- */
.tabulator{border:1px solid #bfdbfe;border-radius:8px;}
.tabulator .tabulator-header{background:#dbeafe;border-bottom:2px solid #93c5fd;color:#1e3a8a;}
.tabulator .tabulator-header .tabulator-col{background:#dbeafe;border-right:1px solid #bfdbfe;}
.tabulator .tabulator-header .tabulator-col .tabulator-col-content{padding:9px 8px;}
.tabulator .tabulator-header .tabulator-col .tabulator-col-title{font-weight:700;}
.tabulator .tabulator-row{border-bottom:1px solid #dbeafe;}
.tabulator .tabulator-row.tabulator-row-even{background:#f5f9ff;}
.tabulator .tabulator-row:hover{background:#e0efff;}
.tabulator .tabulator-row .tabulator-cell{padding:9px 8px;border-right:1px solid #eaf2ff;}
.tabulator .tabulator-row .tabulator-cell:first-child{border-left:5px solid #94a3b8;}
.tabulator .tabulator-row.est-en_proceso .tabulator-cell:first-child{border-left-color:#6366f1;}
.tabulator .tabulator-row.est-recepcionado_parcial .tabulator-cell:first-child{border-left-color:#ca8a04;}
.tabulator .tabulator-row.est-recepcionado_total .tabulator-cell:first-child{border-left-color:#0891b2;}
.tabulator .tabulator-row.est-agendado .tabulator-cell:first-child{border-left-color:#7c3aed;}
.tabulator .tabulator-row.est-completado .tabulator-cell:first-child{border-left-color:#16a34a;}
.tabulator .tabulator-row.est-incidencia .tabulator-cell:first-child{border-left-color:#dc2626;}
.tabulator .tabulator-row.est-terminado_incidencia .tabulator-cell:first-child{border-left-color:#9a3412;}
.tabulator .tabulator-row.rec-si .tabulator-cell:first-child,.tabulator .tabulator-row.ent-exacta .tabulator-cell:first-child{border-left-color:#16a34a;}
.tabulator .tabulator-row.rec-no .tabulator-cell:first-child{border-left-color:#d97706;background:#fffbeb;}
.tabulator .tabulator-row.ent-deducida .tabulator-cell:first-child{border-left-color:#94a3b8;}
.leyenda-listado{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:#6b7280;padding:6px 24px 8px;}
.leyenda-listado span{border-left:5px solid var(--c,#94a3b8);padding-left:6px;}
.mini-list .item{border-left:5px solid #2563eb;background:#f9fbff;border-color:#bfdbfe;border-left-color:#2563eb;}
.estado-terminado_incidencia{background:#fff7ed;color:#9a3412;}
.tabulator .tabulator-row.fila-conincid,.tabulator .tabulator-row.tabulator-row-even.fila-conincid{background:#fecaca !important;}
.tabulator .tabulator-row.fila-conincid .tabulator-cell:first-child{border-left-color:#991b1b;}
/* color de toda la fila según el estado: verde suave = montada y finalizada, naranja suave = completa sin montar, blanco = en proceso */
#tabla_pedidos .tabulator-row.tabulator-row-even,#tabla_montajes .tabulator-row.tabulator-row-even{background:#fff;}
.tabulator .tabulator-row.fila-finalizada,.tabulator .tabulator-row.tabulator-row-even.fila-finalizada{background:#dcfce7 !important;}
.tabulator .tabulator-row.fila-finalizada:hover{background:#bbf7d0 !important;}
.tabulator .tabulator-row.fila-completa,.tabulator .tabulator-row.tabulator-row-even.fila-completa{background:#ffeedd !important;}
.tabulator .tabulator-row.fila-completa:hover{background:#ffe0c2 !important;}
.tabulator .tabulator-row.fila-agendada,.tabulator .tabulator-row.tabulator-row-even.fila-agendada{background:#fef9c3 !important;}
.tabulator .tabulator-row.fila-agendada:hover{background:#fef08a !important;}
.leyenda-listado .sw-leyenda{display:inline-flex;align-items:center;gap:6px;border-left:none;padding-left:0;}
.leyenda-listado .sw-leyenda i{display:inline-block;width:16px;height:12px;border:1px solid #cbd5e1;border-radius:2px;}
.item-pendiente{border-left:5px solid #d97706 !important;background:#fffbeb !important;}
.linea-recibida{border-left:5px solid #16a34a !important;background:#f6fef9 !important;}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ALMMA"><script src="pwa.js" defer></script>
</head>
<body>

<div id="topbar">
  <div class="brand">ALMMA · Mis pedidos<small id="tienda_nombre"></small></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <button class="secondary" onclick="location.href='inicio.html'">🏠 Inicio</button>
    <button onclick="abrirModalNuevo()">+ Nuevo pedido</button>
    <button class="secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div style="display:flex;gap:2px;padding:10px 24px 0;border-bottom:1px solid #e2e4eb;background:#fff">
  <button style="background:none;color:#2563eb;border:none;border-bottom:2px solid #2563eb;border-radius:0;font-weight:600;padding:10px 16px;cursor:pointer">Mis pedidos</button>
  <button style="background:none;color:#6b7280;border:none;border-bottom:2px solid transparent;border-radius:0;font-weight:600;padding:10px 16px;cursor:pointer" onclick="location.href='montajes_tienda.html'">Montajes</button>
</div>
<div class="leyenda-listado" id="leyenda_estados"></div>
<div class="tabla-scroll"><div id="tabla_pedidos"></div></div>

<!-- modal nuevo pedido -->
<div id="modal_nuevo">
  <div class="card">
    <button class="secondary" onclick="cerrarModalNuevo()" style="float:right;">✕</button>
    <h3 style="margin-top:0;">Nuevo pedido</h3>
    <p id="aviso" class="aviso-ok"></p>
    <p id="error" class="error"></p>

    <!-- lectura de PDF: rellena el formulario, NO crea el pedido (migracion/63_funcion_leer_pdf_pedido.ts) -->
    <div style="border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px;">
      <label for="pdf_pedido" style="font-weight:600;">Rellenar desde un PDF o una foto (factura o albarán)</label>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;">
        <input type="file" id="pdf_pedido" accept="application/pdf,.pdf,image/*">
        <button type="button" class="secondary" id="btn_leer_pdf" onclick="leerPdfPedido()">Leer</button>
        <span id="estado_pdf" style="color:var(--muted);font-size:13px;"></span>
      </div>
      <ul id="avisos_pdf" style="display:none;margin:8px 0 0 18px;padding:0;color:#92400e;font-size:13px;"></ul>
    </div>

    <div class="form-grid">
      <div class="campo">
        <label for="nombre_cli">Cliente</label>
        <input id="nombre_cli" required>
      </div>
      <div class="campo">
        <label for="telefono_cli">Teléfono</label>
        <input id="telefono_cli">
      </div>
      <div class="campo" style="grid-column:1/-1;">
        <label for="domicilio_cli">Dirección</label>
        <input id="domicilio_cli">
      </div>
      <div class="campo">
        <label for="localidad_cli">Localidad</label>
        <input id="localidad_cli">
      </div>
      <div class="campo">
        <label for="num_pedido">Nº pedido / albarán</label>
        <input id="num_pedido">
      </div>
    </div>

    <h4>Líneas del pedido</h4>
    <div class="form-grid">
      <div class="campo buscador-articulo" style="grid-column:1/3;">
        <label for="buscar_articulo">Artículo</label>
        <input id="buscar_articulo" placeholder="Buscar por código o descripción...">
        <div id="sugerencias" class="sugerencias"></div>
      </div>
      <div class="campo">
        <label for="cantidad_linea">Cantidad</label>
        <input id="cantidad_linea" type="number" step="1" value="1" min="1">
      </div>
    </div>
    <button type="button" class="secondary" onclick="anyadirLinea()">+ Añadir línea</button>

    <table class="lineas-table" id="tabla_lineas_nuevo">
      <tr><th>Artículo</th><th>Descripción</th><th>Cant.</th><th></th></tr>
    </table>

    <button style="margin-top:18px;" onclick="crearPedido()">Crear pedido</button>
  </div>
</div>

<script src="condiciones.js"></script>
<script>
const client = supabase.createClient(
  "https://uamgbtbsxbrgymhqalak.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWdidGJzeGJyZ3ltaHFhbGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTMyOTIsImV4cCI6MjA5OTg4OTI5Mn0.0OClM8yZmfkiXynOkGLQiLRX-XZjkkP63z5UfIgck8k"
);

let tabla = null;
let dependiente = null;
let lineasNuevoPedido = [];
let articuloSeleccionado = null;
let pdfAdjunto = null; // el PDF leído con "Leer PDF": se guarda con el pedido como soporte

async function comprobarSesion() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) { window.location.href = "login.html"; return; }

  const { data: depRow, error: errDep } = await client.from("dependientes")
    .select("id, nombre, tienda_id").eq("user_id", user.id).maybeSingle();

  if (!depRow) {
    // antes se cerraba la sesión en silencio; ahora se dice por qué (para poder diagnosticarlo)
    document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;font-family:sans-serif"><h3>No se pudo abrir tu cuenta</h3><p>' +
      (errDep ? 'Error: ' + String(errDep.message).replace(/[<>&]/g, "") : 'Esta cuenta no está asociada a ningún dependiente de tienda.') +
      '</p><button onclick="logout()">Volver al inicio de sesión</button></div>';
    return;
  }

  await exigirCondiciones(client);
  dependiente = depRow;
  const { data: tRow } = await client.from("tiendas").select("nombre").eq("id", depRow.tienda_id).maybeSingle();
  document.getElementById("tienda_nombre").textContent = tRow?.nombre || "";
  cargarPedidos();
}

async function logout() {
  await client.auth.signOut();
  window.location.href = "login.html";
}


let conMensaje = new Set();
async function cargarConMensaje() {
  const { data } = await client.rpc("ordenes_con_chat_sin_leer");
  conMensaje = new Set((data || []).map(r => r.anyo + "/" + r.orden));
}
const globo = (a, o) => conMensaje.has(a + "/" + o) ? ' <span title="Mensaje sin leer en el chat" style="background:#dc2626;color:#fff;border-radius:10px;padding:0 6px;font-size:11px">💬</span>' : "";
async function cargarPedidos() {
  await cargarConMensaje();
  const { data, error } = await client.from("ordenes")
    .select("anyo, orden, nombre_cli, num_pedido, estado, con_incidencia, fecha_creacion")
    .eq("tienda_id", dependiente.tienda_id)
    .order("anyo", { ascending: false })
    .order("orden", { ascending: false })
    .limit(200);
  if (error) { console.error(error); return; }

  const columnas = [
    { title: "Año", field: "anyo", width: 70 },
    { title: "Orden", field: "orden", width: 110, formatter: (c) => { const d = c.getData(); return `<a href="orden_tienda.html?anyo=${d.anyo}&orden=${d.orden}">${d.orden}</a>${globo(d.anyo, d.orden)}`; } },
    { title: "Cliente", field: "nombre_cli", minWidth: 220 },
    { title: "Referencia de pedido", field: "num_pedido", minWidth: 170 },
    { title: "Estado", field: "estado", minWidth: 200, formatter: (cell) => {
        if (cell.getValue() === "completado" && cell.getData().con_incidencia) return "Completado con incidencias";
        const v = (cell.getValue() || "en_proceso").replace(/_/g, " ");
        return v.charAt(0).toUpperCase() + v.slice(1);   // solo texto, sin "globo"
      } },
  ];

  if (!tabla) {
    tabla = new Tabulator("#tabla_pedidos", { data, columns: columnas, layout: "fitColumns", height: "calc(100vh - 110px)", rowFormatter: (row) => { const e = row.getData().estado; if (e === "completado" && row.getData().con_incidencia) row.getElement().classList.add("fila-conincid"); else if (e === "completado") row.getElement().classList.add("fila-finalizada"); else if (e === "recepcionado_total") row.getElement().classList.add("fila-completa"); else if (e === "agendado") row.getElement().classList.add("fila-agendada"); }, });
  } else {
    tabla.setData(data);
  }
}

function abrirModalNuevo() {
  lineasNuevoPedido = [];
  renderLineas();
  document.getElementById("aviso").style.display = "none";
  document.getElementById("error").style.display = "none";
  document.getElementById("pdf_pedido").value = "";
  pdfAdjunto = null;
  document.getElementById("estado_pdf").textContent = "";
  document.getElementById("avisos_pdf").style.display = "none";
  document.getElementById("modal_nuevo").style.display = "flex";
}

function cerrarModalNuevo() {
  document.getElementById("modal_nuevo").style.display = "none";
}

let debounceTimer = null;
document.getElementById("buscar_articulo").addEventListener("input", (e) => {
  articuloSeleccionado = null;
  clearTimeout(debounceTimer);
  const texto = e.target.value.trim();
  const caja = document.getElementById("sugerencias");
  if (texto.length < 2) { caja.style.display = "none"; return; }
  debounceTimer = setTimeout(async () => {
    const { data } = await client.from("articulos")
      .select("articulo, descripcion")
      .or(`articulo.ilike.%${texto}%,descripcion.ilike.%${texto}%`)
      .limit(15);
    caja.innerHTML = (data || []).map(a =>
      `<div data-art="${a.articulo}" data-desc="${(a.descripcion || "").replace(/"/g, "&quot;")}">${a.articulo} — ${a.descripcion || ""}</div>`
    ).join("");
    caja.style.display = data && data.length ? "block" : "none";
  }, 250);
});

document.getElementById("sugerencias").addEventListener("click", (e) => {
  const fila = e.target.closest("[data-art]");
  if (!fila) return;
  articuloSeleccionado = { articulo: fila.dataset.art, descripcion: fila.dataset.desc };
  document.getElementById("buscar_articulo").value = `${fila.dataset.art} — ${fila.dataset.desc}`;
  document.getElementById("sugerencias").style.display = "none";
});

function anyadirLinea() {
  const cantidad = parseInt(document.getElementById("cantidad_linea").value, 10) || 1;
  if (!articuloSeleccionado) { alert("Busca y selecciona un artículo de la lista antes de añadirlo."); return; }
  lineasNuevoPedido.push({ ...articuloSeleccionado, cantidad });
  articuloSeleccionado = null;
  document.getElementById("buscar_articulo").value = "";
  document.getElementById("cantidad_linea").value = 1;
  renderLineas();
}

function quitarLinea(i) {
  lineasNuevoPedido.splice(i, 1);
  renderLineas();
}

// el texto que viene de un PDF no es de fiar: se escapa antes de pintarlo
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderLineas() {
  const tabla = document.getElementById("tabla_lineas_nuevo");
  tabla.innerHTML = "<tr><th>Artículo</th><th>Descripción</th><th>Cant.</th><th></th></tr>" +
    lineasNuevoPedido.map((l, i) =>
      `<tr><td>${esc(l.articulo)}</td><td>${esc(l.descripcion)}</td><td>${esc(l.cantidad)}</td>
       <td><button type="button" class="secondary" onclick="quitarLinea(${i})">Quitar</button></td></tr>`
    ).join("");
}

// Artículo genérico "18206 VARIOS": cada línea del PDF va como una línea con su texto en la descripción.
const ARTICULO_GENERICO_PDF = "18206";

function pdfABase64(file) {
  return new Promise((ok, ko) => {
    const lector = new FileReader();
    lector.onload = () => ok(String(lector.result).split(",")[1] || "");
    lector.onerror = () => ko(lector.error);
    lector.readAsDataURL(file);
  });
}

async function leerPdfPedido() {
  const estado = document.getElementById("estado_pdf");
  const avisos = document.getElementById("avisos_pdf");
  const boton = document.getElementById("btn_leer_pdf");
  const errorBox = document.getElementById("error");
  errorBox.style.display = "none";
  avisos.style.display = "none";
  avisos.innerHTML = "";

  const file = document.getElementById("pdf_pedido").files[0];
  if (!file) { estado.textContent = "Elige primero un PDF."; return; }
  if (file.size > 25 * 1024 * 1024) { estado.textContent = "El archivo pesa demasiado."; return; }

  boton.disabled = true;
  pdfAdjunto = null;
  estado.textContent = "Leyendo el documento…";
  try {
    const archivo = await prepararArchivo(file);
    const archivo_base64 = await pdfABase64(archivo);   // los PDF van como pdf_base64 (vale también para la función antigua)
    const { data, error } = await client.functions.invoke("leer-pdf-pedido", { body: archivo.type === "application/pdf" ? { pdf_base64: archivo_base64 } : { archivo_base64, media_type: archivo.type } });
    if (error) {
      // si la función contestó con un mensaje propio, se enseña ese
      let mensaje = "No se pudo leer el PDF.";
      try { const cuerpo = await error.context.json(); if (cuerpo?.error) mensaje = cuerpo.error; } catch (_) {}
      throw new Error(mensaje);
    }

    // solo se rellena lo que el PDF trae; lo que no trae se deja como estaba
    const poner = (id, v) => { if (v) document.getElementById(id).value = v; };
    poner("nombre_cli", data.nombre_cli);
    poner("telefono_cli", data.telefono_cli);
    poner("domicilio_cli", data.domicilio_cli);
    poner("localidad_cli", data.localidad_cli);
    poner("num_pedido", data.num_pedido);
    // una línea por artículo del documento (si la función antigua devuelve "material", una sola)
    const lineas = (data.lineas && data.lineas.length) ? data.lineas : (data.material ? [{ cantidad: 1, descripcion: data.material }] : []);
    if (lineas.length) {
      lineasNuevoPedido = lineas.map(l => ({ articulo: ARTICULO_GENERICO_PDF, descripcion: l.descripcion, cantidad: l.cantidad || 1 }));
      renderLineas();
    }
    pdfAdjunto = archivo;
    estado.textContent = "Listo. Revisa los datos antes de crear el pedido. El documento se guardará con el pedido.";
    if (data.avisos && data.avisos.length) {
      avisos.innerHTML = data.avisos.map(a => `<li>${esc(a)}</li>`).join("");
      avisos.style.display = "block";
    }
  } catch (e) {
    estado.textContent = "";
    errorBox.textContent = e.message;
    errorBox.style.display = "block";
  } finally {
    boton.disabled = false;
  }
}

// Prepara el archivo para leerlo: un PDF se manda tal cual; una FOTO se reduce a 2000 px y se pasa a JPG
// (así pesa poco, la IA la lee igual y entra en el límite). Devuelve el archivo que se leerá Y se guardará.
async function prepararArchivo(file) {
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    if (file.size > 5 * 1024 * 1024) throw new Error("El PDF pesa más de 5 MB.");
    return file;
  }
  if (!file.type.startsWith("image/")) throw new Error("Solo se pueden leer PDF o fotos.");
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (_) { throw new Error("No se pudo abrir la foto. Si es de iPhone (HEIC), guárdala como JPG o hazle una captura."); }
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const lienzo = document.createElement("canvas");
  lienzo.width = Math.round(bmp.width * k); lienzo.height = Math.round(bmp.height * k);
  lienzo.getContext("2d").drawImage(bmp, 0, 0, lienzo.width, lienzo.height);
  const blob = await new Promise(ok => lienzo.toBlob(ok, "image/jpeg", 0.85));
  if (!blob) throw new Error("No se pudo preparar la foto.");
  return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
}

function nombreSeguroArchivo(file) {
  const base = file.name.replace(/\.(pdf|jpe?g|png|webp|gif)$/i, "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^A-Za-z0-9._-]+/g, "_").slice(0, 60) || "documento";
  return base + (file.type === "application/pdf" ? ".pdf" : ".jpg");
}

// devuelve null si fue bien, o el motivo del fallo
async function guardarPdfSoporte(anyo, orden, file) {
  const ruta = `${anyo}/${orden}/documentos/${Date.now()}_${nombreSeguroArchivo(file)}`;
  const { error: errSub } = await client.storage.from("ordenes-adjuntos").upload(ruta, file, { contentType: file.type });
  if (errSub) return errSub.message;
  const { error: errFila } = await client.from("documentos_orden").insert({ anyo, orden, storage_path: ruta, nombre: file.name });
  return errFila ? errFila.message : null;
}

async function crearPedido() {
  const errorBox = document.getElementById("error");
  const avisoBox = document.getElementById("aviso");
  errorBox.style.display = "none";
  avisoBox.style.display = "none";

  const nombre_cli = document.getElementById("nombre_cli").value.trim();
  if (!nombre_cli) { errorBox.textContent = "Falta el nombre del cliente."; errorBox.style.display = "block"; return; }
  if (lineasNuevoPedido.length === 0) { errorBox.textContent = "Añade al menos una línea de artículo."; errorBox.style.display = "block"; return; }

  const domicilio_cli = document.getElementById("domicilio_cli").value.trim();
  const localidad_cli = document.getElementById("localidad_cli").value.trim();
  const telefono_cli = document.getElementById("telefono_cli").value.trim();
  const num_pedido = document.getElementById("num_pedido").value.trim();

  const { data, error } = await client.rpc("crear_pedido", {
    p_nombre_cli: nombre_cli,
    p_domicilio_cli: domicilio_cli,
    p_localidad_cli: localidad_cli,
    p_telefono_cli: telefono_cli,
    p_num_pedido: num_pedido,
    p_lineas: lineasNuevoPedido.map(l => ({ articulo: l.articulo, descripcion: l.descripcion, cantidad: l.cantidad })),
  });

  if (error) { errorBox.textContent = "No se pudo crear el pedido: " + error.message; errorBox.style.display = "block"; return; }

  const { anyo, orden } = data[0];
  avisoBox.textContent = `Pedido ${anyo}/${orden} creado correctamente.`;
  avisoBox.style.display = "block";

  // el PDF leído se guarda como soporte de la orden (migracion/64_documentos_de_la_orden.sql)
  if (pdfAdjunto) {
    const fallo = await guardarPdfSoporte(anyo, orden, pdfAdjunto);
    if (fallo) {
      avisoBox.textContent += " Pero el documento no se pudo guardar con el pedido (" + fallo + "). Guárdalo aparte y mándaselo a ALMMA.";
      pdfAdjunto = null;
      cargarPedidos();
      return; // no se cierra la ventana para que se lea el aviso
    }
    pdfAdjunto = null;
    avisoBox.textContent += " Documento guardado como soporte.";
  }
  cargarPedidos();
  setTimeout(cerrarModalNuevo, 1200);
}

})();
