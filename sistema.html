<style>
:root{--primary:#2563eb;--bg:#f5f6fa;--card:#fff;--border:#e2e4eb;--text:#1f2430;--muted:#6b7280;}

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
button{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;}
button:hover{opacity:.9;}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
input,select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;}

#menubar{background:#1f2430;color:#e5e7eb;display:flex;align-items:center;padding:0 12px;font-size:13px;position:relative;z-index:20;}
#menubar .brand{font-weight:700;color:#fff;padding:10px 16px 10px 0;font-size:15px;}
.menu-item{position:relative;}
.menu-item > span{display:block;padding:10px 14px;cursor:pointer;}
.menu-item:hover > span, .menu-item.abierto > span{background:#374151;}
.menu-drop{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--text);min-width:220px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);border-radius:0 0 8px 8px;overflow:hidden;}
.menu-item.abierto .menu-drop{display:block;}
.menu-drop a{display:block;padding:10px 16px;color:var(--text);text-decoration:none;font-size:13px;border-bottom:1px solid var(--border);}
.menu-drop a:hover{background:var(--bg);}
#toolbar{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
#toolbar .spacer{flex:1;}

.cat-tabs{display:flex;gap:2px;padding:12px 24px 0;border-bottom:1px solid var(--border);background:var(--card);}
.cat-tab{background:none;border:none;color:var(--muted);padding:10px 16px;font-size:14px;font-weight:600;border-bottom:2px solid transparent;}
.cat-tab.activa{color:var(--primary);border-bottom-color:var(--primary);}
.cat-panel{display:none;}
.cat-panel.activa{display:block;}

.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 24px;}
.barra input{flex:1;min-width:220px;max-width:420px;}
#filtros_articulos{align-items:flex-end;}

.tabla-scroll{margin:0 24px 24px;overflow-x:auto;}

.campo select,.campo input{width:100%;}
.aviso-carga{color:var(--muted);font-size:13px;}

#menubar .menu-item > span{background:#dbeafe;color:#1e3a8a;font-weight:600;margin:5px 3px;padding:6px 14px;border-radius:6px;border:1px solid #93c5fd;}

async function comprobarSesion() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) { window.location.href = "login.html"; return; }
  const { data: staffRow } = await client.from("staff").select("user_id, es_montador, solo_deca, solo_montajes").eq("user_id", user.id).maybeSingle();
  if (!staffRow) { await client.auth.signOut(); window.location.href = "login.html"; return; }
  if (staffRow.solo_deca) { window.location.href = "deca.html"; return; }
  if (staffRow.solo_montajes) { window.location.href = "montador.html"; return; }

  const params = new URLSearchParams(window.location.search);

}

function cambiarCatalogo(cat) {
  catalogoActivo = cat;
  document.querySelectorAll(".cat-tab").forEach(b => b.classList.toggle("activa", b.dataset.cat === cat));
  document.getElementById("buscador").value = "";
  document.getElementById("btn_nuevo").style.display = "inline-block";
  // artículos: tres filtros separados (tienda, código y descripción) en lugar de un buscador único
  const esArticulos = cat === "articulos";
  document.getElementById("buscador").style.display = esArticulos ? "none" : "";
  document.getElementById("filtros_articulos").style.display = esArticulos ? "flex" : "none";
  if (esArticulos) prepararFiltrosArticulos();
  cargarCatalogo();
}

let catalogoCompleto = [];   // lista entera del catálogo abierto: el buscador filtra siempre sobre ella
async function cargarCatalogo() {
  const cfg = CATALOGOS[catalogoActivo];
  const avisoBox = document.getElementById("aviso_carga");
  if (cfg.requiereBusqueda) {
    avisoBox.textContent = "Rellena algún filtro (tienda, código o descripción) para ver artículos: hay demasiados para listarlos todos.";
    renderTabla(cfg, []);
    return;
  }
  avisoBox.textContent = "Cargando...";
  const { data, error } = await client.from(cfg.tabla).select("*").order(cfg.orden).limit(1000);
  if (error) { avisoBox.textContent = "Error: " + error.message; return; }

  if (catalogoActivo === "dependientes") {
    const tiendas = await cargarTiendas();
    const porId = Object.fromEntries(tiendas.map(t => [t.id, t.nombre]));
    data.forEach(d => { d._tienda = porId[d.tienda_id] || ""; d._acceso = d.user_id ? "Sí" : "No"; });
  }

  avisoBox.textContent = `${data.length} registros.`;
  catalogoCompleto = data;
  renderTabla(cfg, data);
}

// no usamos la opcion rowClick de Tabulator: bloquea el callback si detecta
// cualquier seleccion de texto activa en la pagina (falso positivo frecuente
// en Safari/trackpad de Mac), dejando el click sin efecto. Escuchamos el click
// directamente sobre el contenedor para evitar ese bloqueo. #tabla_catalogo se
// reutiliza tanto para los catalogos normales como para montadores (caso
// especial), asi que el listener despacha segun catalogoActivo.
document.getElementById("tabla_catalogo").addEventListener("click", (e) => {
  if (!tabla) return;
  const rowEl = e.target.closest(".tabulator-row");
  if (!rowEl) return;
  const row = tabla.getRows().find(r => r.getElement() === rowEl);
  if (!row) return;
  abrirEditar(row.getData());
});

function renderTabla(cfg, data) {
  const columnas = cfg.columnasLista.map(campo => ({
    title: cfg.cabeceras[campo] || campo, field: campo,
    formatter: ["listado_albaranes", "activo", "especial"].includes(campo) ? (c => c.getValue() ? "Sí" : "No") : undefined,
  }));
  if (!tabla) {
    tabla = new Tabulator("#tabla_catalogo", {
      data, columns: columnas, layout: "fitColumns", height: "calc(100vh - 260px)",
    });
  } else {
    tabla.setColumns(columnas);
    tabla.setData(data);
  }
}

let tiendasArticulosListas = false;
let tiendasNombres = [];
async function prepararFiltrosArticulos() {
  if (tiendasArticulosListas) return;
  const { data } = await client.from("tiendas").select("codigo, nombre").not("codigo", "is", null).order("nombre");
  document.getElementById("dl_tiendas_art").innerHTML = (data || [])
    .map(t => `<option value="${t.codigo} · ${(t.nombre || "").replace(/"/g, "&quot;")}">`).join("");
  tiendasArticulosListas = true;
}

let debounceArticulos = null;
function buscarArticulosDebounce() { clearTimeout(debounceArticulos); debounceArticulos = setTimeout(buscarArticulos, 300); }

async function buscarArticulos() {
  const cfg = CATALOGOS.articulos;
  const aviso = document.getElementById("aviso_carga");
  const tienda = document.getElementById("fa_tienda").value.trim();
  const codigo = document.getElementById("fa_codigo").value.trim();
  const desc = document.getElementById("fa_desc").value.trim();
  if (!tienda && !codigo && desc.length < 2) {
    aviso.textContent = "Rellena algún filtro (tienda, código o descripción de al menos 2 letras) para ver artículos.";
    renderTabla(cfg, []);
    return;
  }
  aviso.textContent = "Buscando...";
  let q = client.from("articulos").select("*").order("articulo").limit(300);
  if (codigo) q = q.ilike("articulo", `%${codigo}%`);
  if (desc) q = q.ilike("descripcion", `%${desc}%`);
  if (tienda) {
    const m = tienda.match(/^(\d+)/);   // "354" o "354 · TEMPUR SEALY": manda el código
    if (m) q = q.eq("proveedor", parseInt(m[1], 10));
    else {
      if (!tiendasNombres.length) { const { data: todas } = await client.from("tiendas").select("codigo, nombre").not("codigo", "is", null); tiendasNombres = todas || []; }
      const sa = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();   // sin acentos ni mayúsculas
      const palabras = sa(tienda).split(/\s+/).filter(Boolean);
      const codigos = tiendasNombres.filter(t => palabras.every(p => sa(t.nombre).includes(p))).map(t => t.codigo);
      if (!codigos.length) { aviso.textContent = "Ninguna tienda coincide con ese nombre."; renderTabla(cfg, []); return; }
      q = q.in("proveedor", codigos);
    }
  }
  const { data, error } = await q;
  if (error) { aviso.textContent = "Error: " + error.message; return; }
  const codigosTienda = [...new Set(data.map(a => a.proveedor).filter(x => x !== null && x !== undefined))];
  const nombres = {};
  if (codigosTienda.length) {
    const { data: ts } = await client.from("tiendas").select("codigo, nombre").in("codigo", codigosTienda);
    (ts || []).forEach(t => { nombres[t.codigo] = t.nombre; });
  }
  data.forEach(a => { a._tienda = (a.proveedor !== null && a.proveedor !== undefined) ? `${a.proveedor} · ${nombres[a.proveedor] || ""}` : ""; });
  aviso.textContent = `${data.length} resultados` + (data.length >= 300 ? " (puede haber más: acota los filtros)" : "") + ".";
  renderTabla(cfg, data);
}

async function buscarEnCatalogo() {
  if (catalogoActivo === "articulos") { buscarArticulosDebounce(); return; }
  const cfg = CATALOGOS[catalogoActivo];
  const texto = document.getElementById("buscador").value.trim();
  const avisoBox = document.getElementById("aviso_carga");

  if (cfg.requiereBusqueda) {
    if (texto.length < 2) { avisoBox.textContent = "Escribe al menos 2 caracteres."; renderTabla(cfg, []); return; }
    avisoBox.textContent = "Buscando...";
    const or = cfg.buscarCampos.map(c => `${c}.ilike.%${texto}%`).join(",");
    const { data, error } = await client.from(cfg.tabla).select("*").or(or).order(cfg.orden).limit(200);
    if (error) { avisoBox.textContent = "Error: " + error.message; return; }
    avisoBox.textContent = `${data.length} resultados.`;
    renderTabla(cfg, data);
    return;
  }
  // catalogos pequeños: filtro en cliente sobre lo ya cargado
  if (!tabla) return;
  if (!texto) { tabla.setData(catalogoCompleto); return; }
  const filas = catalogoCompleto;   // antes se filtraba sobre lo ya filtrado y borrar letras no devolvía filas
  const _sa = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const ptexto = _sa(texto).split(/\s+/).filter(Boolean);
  const filtradas = filas.filter(f => { const todo = _sa(cfg.buscarCampos.map(c => f[c] || "").join(" ")); return ptexto.every(p => todo.includes(p)); });
  tabla.setData(filtradas);
}

// ¿este campo es un código que se asigna solo (siguiente número) al crear un registro nuevo?
function esCodigoAutomatico(cfg, campoId) {
  return !!cfg.autoCodigo && (campoId === cfg.autoCodigo.principal || campoId === cfg.autoCodigo.espejo);
}

// siguiente código correlativo: el mayor que existe + 1
async function siguienteCodigo(cfg) {
  const ac = cfg.autoCodigo;
  if (ac.texto) {   // columna de texto (dependientes): se calcula sobre los valores numéricos
    const { data, error } = await client.from(cfg.tabla).select(ac.principal).limit(10000);
    if (error) throw error;
    return (data || []).reduce((m, r) => { const n = parseInt(r[ac.principal], 10); return isNaN(n) ? m : Math.max(m, n); }, 0) + 1;
  }
  const { data, error } = await client.from(cfg.tabla).select(ac.principal)
    .not(ac.principal, "is", null).order(ac.principal, { ascending: false }).limit(1);
  if (error) throw error;
  return (data && data.length ? data[0][ac.principal] : 0) + 1;
}

async function renderFormulario(cfg, registro) {
  const cont = document.getElementById("p_campos");
  let html = "";
  for (const campo of cfg.campos) {
    const valor = registro[campo.id] ?? "";
    if (campo.tipo === "titulo") {
      html += `<h4 style="margin:20px 0 8px;padding-top:12px;border-top:1px solid var(--border);">${campo.label}</h4>`;
    } else if (campo.tipo === "copiar-articulos") {
      if (registroActivo) continue;   // solo se ofrece al crear una tienda nueva
      await prepararFiltrosArticulos();
      html += `<div class="campo" style="margin-top:14px;padding:12px;background:#eff6ff;border-radius:8px;"><label>${campo.label}</label>
        <input id="f_${campo.id}" list="dl_tiendas_art" placeholder="Escribe el código o el nombre de la tienda de la que copiar (opcional)" autocomplete="off"></div>`;
    } else if (campo.tipo === "checkbox") {
      html += `<div class="campo"><label><input type="checkbox" id="f_${campo.id}" ${valor ? "checked" : ""} style="width:auto;"> ${campo.label}</label></div>`;
    } else if (campo.tipo === "select-tienda") {
      const tiendas = await cargarTiendas();
      html += `<div class="campo"><label>${campo.label}</label><select id="f_${campo.id}">
        <option value="">-- sin asignar --</option>
        ${tiendas.map(t => `<option value="${t.id}" ${t.id === valor ? "selected" : ""}>${t.nombre}</option>`).join("")}
      </select></div>`;
    } else {
      const soloLectura = campo.soloLectura ? "readonly" : "";
      const tipo = campo.tipo === "number" ? "number" : "text";
      const deshabilitadoEdicion = (campo.id === cfg.pk && registroActivo) ? "readonly" : "";
      if (esCodigoAutomatico(cfg, campo.id) && !registroActivo) {
        html += `<div class="campo"><label>${campo.label}</label><input id="f_${campo.id}" type="text" value="" placeholder="Se asigna solo al grabar (el siguiente número)" readonly></div>`;
        continue;
      }
      html += `<div class="campo"><label>${campo.label}</label><input id="f_${campo.id}" type="${tipo}" value="${valor ?? ""}" ${soloLectura} ${deshabilitadoEdicion}></div>`;
    }
  }
  if (catalogoActivo === "dependientes") {
    html += `<div class="campo"><label>Último acceso</label><div>${registro.user_id ? "Cuenta creada (ver Supabase)" : "Sin cuenta de acceso todavía"}</div></div>
      <button type="button" class="secondary" onclick="proximamente('Crear acceso de dependiente')">Crear acceso</button>`;
  }
  cont.innerHTML = html;
}

// --- borrar: solo si nada lo usa (para no dejar órdenes, líneas o facturas apuntando a algo que ya no existe) ---
async function contar(tabla, columna, valor, soloConUsuario) {
  let q = client.from(tabla).select("*", { count: "exact", head: true }).eq(columna, valor);
  if (soloConUsuario) q = q.not("user_id", "is", null);
  const { count, error } = await q;
  if (error) throw error;
  return count || 0;
}

const USOS_CATALOGO = {
  tiendas:      (r) => [["órdenes", "ordenes", "tienda_id", r.id], ["facturas", "cabfacturas", "tienda_id", r.id], ["movimientos de almacén", "alm_movimientos", "tienda_id", r.id]],
  fabricantes:  (r) => [["órdenes", "ordenes", "proveedor", r.codigo], ["líneas de pedido", "linorden", "proveedor", r.codigo]],
  dependientes: (r) => [["órdenes", "ordenes", "dependiente_id", r.id]],
  montadores:   (r) => [["asignaciones a órdenes", "ordenes_montadores", "montador_id", r.id]],
  articulos:    (r) => [["líneas de pedido", "linorden", "articulo", r.articulo], ["líneas de factura", "linfacturas", "articulo", r.articulo], ["movimientos de almacén", "alm_movimientos", "articulo", r.articulo]],
};

async function borrarRegistro() {
  if (!registroActivo) return;
  const cfg = CATALOGOS[catalogoActivo];
  const nombre = registroActivo.nombre || registroActivo.articulo || "este registro";
  let extra = "";
  let nArticulos = 0, nDependientes = 0;
  try {
    const usos = [];
    for (const [etiqueta, tabla, columna, valor] of USOS_CATALOGO[catalogoActivo](registroActivo)) {
      const n = await contar(tabla, columna, valor);
      if (n) usos.push(`${n.toLocaleString("es-ES")} ${etiqueta}`);
    }
    if (usos.length) {
      alert(`No se puede borrar "${nombre}": se usa en ${usos.join(", ")}.` +
        (catalogoActivo === "montadores" ? "\n\nSi ya no trabaja, desmárcalo como Activo y dejará de salir en la lista de asignar." : "") +
        (catalogoActivo === "tiendas" ? "\n\nUna tienda con historial no se puede borrar, para no perder sus órdenes y facturas." : ""));
      return;
    }
    if (catalogoActivo === "tiendas") {
      if (await contar("dependientes", "tienda_id", registroActivo.id, true)) {
        alert(`No se puede borrar "${nombre}": tiene dependientes con cuenta de acceso.`);
        return;
      }
      nArticulos = await contar("articulos", "proveedor", registroActivo.codigo);
      nDependientes = await contar("dependientes", "tienda_id", registroActivo.id);
      if (nArticulos || nDependientes) extra = `\n\nSe borrarán también sus ${nArticulos} artículos y sus ${nDependientes} dependientes.`;
    }
    if (!confirm(`¿Borrar "${nombre}"?${extra}\n\nNo se puede deshacer.`)) return;
    if (catalogoActivo === "tiendas") {
      if (nArticulos) { const { error } = await client.from("articulos").delete().eq("proveedor", registroActivo.codigo); if (error) throw error; }
      if (nDependientes) { const { error } = await client.from("dependientes").delete().eq("tienda_id", registroActivo.id); if (error) throw error; }
    }
    const { error } = await client.from(cfg.tabla).delete().eq(cfg.pk, registroActivo[cfg.pk]);
    if (error) throw error;
  } catch (e) {
    alert("No se pudo borrar: " + (e.message || e));
    return;
  }
  cerrarPanel();
  if (catalogoActivo === "articulos") buscarArticulos(); else cargarCatalogo();
}

function cerrarPanel() {
  document.getElementById("panel_editar").style.display = "none";
  document.getElementById("overlay").style.display = "none";
  registroActivo = null;
}

async function guardarRegistro() {
  const cfg = CATALOGOS[catalogoActivo];
  const valores = {};
  for (const campo of cfg.campos) {
    if (campo.tipo === "titulo" || campo.tipo === "copiar-articulos") continue;
    if (!registroActivo && esCodigoAutomatico(cfg, campo.id)) continue;   // lo pone siguienteCodigo()
    if (campo.tipo === "checkbox") {
      valores[campo.id] = document.getElementById(`f_${campo.id}`).checked;
    } else if (campo.tipo === "select-tienda") {
      valores[campo.id] = document.getElementById(`f_${campo.id}`).value || null;
    } else if (campo.tipo === "number") {
      const v = document.getElementById(`f_${campo.id}`).value;
      valores[campo.id] = v === "" ? null : parseFloat(v);
    } else {
      const v = document.getElementById(`f_${campo.id}`).value.trim();
      valores[campo.id] = v || null;
    }
  }

  let error;
  let codigoAsignado = null;
  const campoCopia = document.getElementById("f__copiar");
  const origenCopia = (!registroActivo && campoCopia) ? ((campoCopia.value.trim().match(/^(\d+)/) || [])[1] || null) : null;
  if (!registroActivo && campoCopia && campoCopia.value.trim() && !origenCopia) {
    alert("Para copiar artículos, elige una tienda de la lista (empieza por su código) o deja el campo vacío.");
    return;
  }
  if (registroActivo) {
    ({ error } = await client.from(cfg.tabla).update(valores).eq(cfg.pk, registroActivo[cfg.pk]));
  } else if (cfg.autoCodigo) {
    // código correlativo automático; si otra persona coge el mismo número a la vez, se reintenta con el siguiente
    for (let intento = 0; intento < 5; intento++) {
      let n;
      try { n = await siguienteCodigo(cfg); } catch (e) { error = e; break; }
      const ac = cfg.autoCodigo;
      const fila = { ...valores, [ac.principal]: ac.texto ? String(n) : n };
      if (ac.espejo) fila[ac.espejo] = String(n);
      ({ error } = await client.from(cfg.tabla).insert(fila));
      if (!error) { codigoAsignado = n; break; }
      if (error.code !== "23505") break;   // 23505 = código repetido
    }
  } else {
    ({ error } = await client.from(cfg.tabla).insert(valores));
  }
  if (error) { alert("No se pudo guardar: " + error.message); return; }
  cerrarPanel();
  let textoFinal = codigoAsignado !== null ? `${cfg.titulo}: creado con el código ${codigoAsignado}.` : "";
  if (origenCopia && codigoAsignado !== null) {
    const { data: copiados, error: errCopia } = await client.rpc("copiar_articulos_tienda", { p_origen: parseInt(origenCopia, 10), p_destino: codigoAsignado });
    textoFinal += errCopia
      ? `\n\nLa tienda se creó, pero NO se pudieron copiar los artículos: ${errCopia.message}`
      : `\n\nSe copiaron ${copiados} artículos de la tienda ${origenCopia}. Ahora solo hay que modificar los importes (Artículos → filtra por la tienda ${codigoAsignado}).`;
  }
  if (textoFinal) alert(textoFinal);
  if (catalogoActivo === "articulos") buscarArticulos(); else cargarCatalogo();
}
