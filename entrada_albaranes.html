<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMMA - Entrada por albarán</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#2563eb;--bg:#f5f6fa;--card:#fff;--border:#e2e4eb;--text:#1f2430;--muted:#6b7280;--ok:#15803d;--okbg:#f0fdf4;--warn:#b45309;--warnbg:#fffbeb;--bad:#dc2626;--badbg:#fef2f2;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{display:flex;flex-direction:column;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.top{flex:none;background:#1f2430;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;height:52px;}
.top b{font-size:15px;}
.maq{background:#fde68a;color:#78350f;border-radius:5px;padding:3px 9px;font-size:12px;font-weight:700;}
.top .sp{flex:1;}
.drop{border:2px dashed #93c5fd;color:#dbeafe;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;}
.drop:hover{background:#374151;}
.app{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(340px,1.15fr) minmax(480px,1.45fr);}
.col{min-height:0;overflow-y:auto;border-right:1px solid var(--border);}
#lista{background:#fff;}
#lista h3{margin:0;padding:12px 14px 6px;font-size:13px;}
.resumen{padding:0 14px 10px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);}
.doc{display:block;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--border);padding:10px 14px;cursor:pointer;font:inherit;color:inherit;border-left:4px solid transparent;}
.doc:hover{background:var(--bg);}
.doc.act{background:#eff6ff;border-left-color:var(--primary);}
.doc .n{font-weight:600;font-size:13px;}
.doc .s{font-size:12px;color:var(--muted);margin-top:2px;}
.chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap;}
.c-ok{background:#dcfce7;color:var(--ok);}
.c-rev{background:#fef3c7;color:var(--warn);}
.c-no{background:#fee2e2;color:var(--bad);}
.c-hecho{background:#e5e7eb;color:#4b5563;}
.c-gr{background:#e0e7ff;color:#3730a3;}
#visor{background:#2b2f3a;padding:10px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
.vbox{flex:1;min-height:0;display:flex;flex-direction:column;}
.vbox .imgbox,.vbox .papel{flex:1;min-height:0;}
.vbox.peq{flex:none;}
.vbox.peq .sinpdf{flex:none;padding:6px 10px;font-size:12px;min-height:0;}
.vbox.peq .bar{margin-bottom:4px;}
.papel{overflow:auto;border-radius:6px;background:#fff;padding:14px 16px;font-size:12px;color:#222;}
.papel h6{margin:0 0 6px;font-size:14px;}
.papel table{width:100%;border-collapse:collapse;margin-top:8px;}
.papel td,.papel th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;}
.sinpdf{flex:1;border:2px dashed #64748b;border-radius:6px;color:#94a3b8;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:13px;}
#visor .bar{color:#cbd5e1;font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between;}
#visor .imgbox{overflow:auto;border-radius:6px;background:#fff;cursor:zoom-in;}
#visor .imgbox.zoom{cursor:zoom-out;}
#visor img{display:block;width:100%;}
#visor .imgbox.zoom img{width:220%;}
#panel{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
#pbody{flex:1;min-height:0;overflow-y:auto;padding-bottom:10px;}
.sec{background:var(--card);border:1px solid var(--border);border-radius:10px;margin:14px;padding:14px 16px;}
.sec h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px;}
.sec h4 .num{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
.campo label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px;}
input,select{padding:7px 9px;border:1px solid var(--border);border-radius:6px;font:inherit;width:100%;}
.campo.dud input{background:var(--warnbg);border-color:#f59e0b;}
.campo.dud label::after{content:" ⚠ revisar";color:var(--warn);}
.campo.edit input{border-color:var(--primary);}
.avisos{margin-top:10px;background:var(--warnbg);border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:12px;color:#78350f;}
button{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;}
button:hover{opacity:.9;}
button.sec2{background:#fff;color:var(--text);border:1px solid var(--border);}
button.peq{padding:3px 9px;font-size:12px;}
button:disabled{opacity:.4;cursor:not-allowed;}
.orden{border:2px solid var(--primary);border-radius:10px;padding:12px 14px;background:#f8fbff;}
.orden .t{font-size:16px;font-weight:700;}
.orden .m{color:var(--muted);font-size:13px;margin-top:2px;}
.score{float:right;font-weight:700;border-radius:8px;padding:3px 10px;}
.razones{margin:8px 0 0;padding:0;list-style:none;font-size:13px;}
.razones li{padding:1px 0;}
.razones .y::before{content:"✔ ";color:var(--ok);}
.razones .n::before{content:"⚠ ";color:var(--warn);}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.alt{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px;cursor:pointer;background:#fff;}
.alt:hover{border-color:var(--primary);}
.vacio{border:2px dashed #fca5a5;background:var(--badbg);border-radius:10px;padding:14px;color:#7f1d1d;}
.busca{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;}
.busca .res{max-height:220px;overflow-y:auto;margin-top:8px;}
.res .it{border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:6px;cursor:pointer;font-size:13px;background:#fff;}
.res .it:hover{border-color:var(--primary);background:#eff6ff;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cols h5{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.lin{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--border);border-left:5px solid #cbd5e1;border-radius:8px;padding:7px 8px;margin-bottom:6px;cursor:pointer;background:#fff;font-size:13px;}
.lin.sel{outline:2px solid var(--primary);background:#eff6ff;}
.lin input{width:auto;margin-top:3px;}
.lin .d{flex:1;}
.lin .cod{color:var(--muted);font-size:11px;}
.lin.ign{opacity:.5;}
.unir{display:flex;gap:8px;align-items:center;margin:8px 0 12px;flex-wrap:wrap;}
.grupo{display:grid;grid-template-columns:1fr 78px 78px 26px;gap:8px;align-items:center;border:1px solid var(--border);border-left:5px solid #999;border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fff;font-size:13px;}
.grupo .gh{color:var(--muted);font-size:11px;}
.grupo input{padding:5px 6px;}
.grupo .x{background:transparent;color:var(--bad);border:none;font-size:16px;padding:0;}
.tot{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:8px;}
.tot.ok{background:var(--okbg);color:var(--ok);}
.tot.warn{background:var(--warnbg);color:var(--warn);}
.pie{flex:none;background:#fff;border-top:2px solid var(--primary);padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 -4px 12px -6px rgba(0,0,0,.25);}
.pie .info{flex:1;font-size:13px;color:var(--muted);}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:50;max-width:80vw;}
.nota{font-size:12px;color:var(--muted);margin:0 14px 14px;}
@media(max-width:1100px){#visor{overflow:visible}.vbox{flex:none}.vbox .imgbox,.vbox .papel,.sinpdf{max-height:60vh;min-height:140px}.app{grid-template-columns:1fr;height:auto}.col{max-height:none}#visor .imgbox{max-height:70vh}.cols{grid-template-columns:1fr}}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{background:#eff6ff;color:#1e3a8a;text-align:left;padding:6px 8px;font-size:12px}.tb td{border-bottom:1px solid var(--border);padding:6px 8px;vertical-align:top}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;align-items:center;justify-content:center}.mbox{background:#fff;border-radius:12px;padding:18px 20px;max-width:760px;width:92vw;max-height:84vh;overflow:auto}
.vbox iframe{display:block}
</style>
</head>
<body>
<div class="top">
  <a href="recepcion.html" style="color:#93c5fd;text-decoration:none;font-size:13px">← Entradas Almacén</a>
  <b>Entrada por albarán</b>
  <span class="maq">PRUEBA · ya registra de verdad</span>
  <span class="sp"></span><span id="est" style="font-size:12px;color:#cbd5e1"></span>
  <label class="drop" id="subirbtn">⬆ Subir fotos de albaranes<input type="file" accept="image/*" multiple style="display:none" onchange="subir(this.files);this.value=''"></label>
</div>
<div class="app">
  <aside class="col" id="lista"></aside>
  <section class="col" id="visor"></section>
  <section class="col" id="panel"><div id="pbody"></div><div id="pfoot"></div></section>
</div>
<div id="modal" style="display:none"></div><div id="toast"></div>

<script>
const ESTADO = {en_proceso:'En proceso',recepcionado_parcial:'Recep. parcial',recepcionado_total:'Recep. total',incidencia:'Incidencia',completado:'Montada',agendado:'Agendada',nueva:'Nueva'};
const CLS = {'casa solo':['Casa sola','c-ok'],'revisar':['Revisar','c-rev'],'dudoso':['Dudoso','c-no'],'sin orden':['Sin orden','c-no']};
const CAMPOS=[['fabricante','Fabricante'],['tienda_destino','Tienda / destinatario'],['num_albaran','Nº albarán'],['fecha_albaran','Fecha albarán'],['pedido_fabricante','Pedido del fabricante'],['cliente_final','Cliente final'],['bultos_impresos','Bultos (impresos)'],['bultos_mano','Bultos a mano (xB) ★'],['peso_kg','Peso total (kg)'],['fecha_sello_recibido','Recibido (sello ALMMA)'],['ubicacion','Ubicación (a mano)']];
const COL=['#2563eb','#db2777','#059669','#d97706','#7c3aed','#0891b2','#be123c'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function toks(s){let n=norm(s);if(/protector/.test(n))n=n.replace(/mattress|colchon/g,'');
  n=n.replace(/pillows?/g,'almohada').replace(/mattress/g,'colchon').replace(/sommier/g,'somier');
  n=n.replace(/(\d)x(\d)/g,'$1 $2').replace(/(\d)x(\d)/g,'$1 $2').replace(/(\d)\*(\d)/g,'$1 $2');
  return new Set(n.split(/[^a-z0-9]+/).map(t=>t.length>4&&t.endsWith('s')?t.slice(0,-1):t).filter(t=>t.length>=3&&!['con','por','los','las','del','sin'].includes(t)));}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000);}
// % de coincidencia estimado a partir de la prueba (≥90 % casi siempre acierta)
const pct=s=>s>=100?99:s>=65?Math.round(90+(s-65)*9/35):s>=40?Math.round(65+(s-40)):Math.round(s*65/40);
function canon(s){const n=norm(s);if(/dimaflex/.test(n))return 'Dimaflex';if(/ample|trenco|flex/.test(n))return 'Ample (Ample Trenco / Flex)';if(/morte/.test(n))return 'Morte';if(/menut/.test(n))return 'Menut';if(/hogaralia|tomasella/.test(n))return 'Tomasella (Hogaralia)';if(/tomuma|alcaina/.test(n))return 'Tomuma (Alcaina)';if(/tempur/.test(n))return 'Tempur';if(/dimaflex/.test(n))return 'Dimaflex';if(/nucleo/.test(n))return 'Núcleo';if(/masia/.test(n))return 'Masiá';if(/miguel/.test(n))return 'Miguel';return s||'Sin identificar';}

const FAB_STOP=new Set(['muebles','mueble','mobiliario','sl','sa','scoop','coop','decoracion','furniture','european','europea','auropea','tapizados','talleres','hermanos','hnos','grupo','group','spain','espana','casa','sillas','diseno','iberica','cb']);
const FAB_GEN=['fabricantes varios','varios','tienda','texto',''];
// Fabricantes que son el mismo con otro nombre (confirmados por ALMMA). En la app real: tabla editable en Sistema → Fabricantes.
const FAB_EQUIV=[['kazzano','dormisur'],['tetrys','tetris'],['gugel','tomasella']];
let ALIAS_L=[];try{ALIAS_L=JSON.parse(localStorage.getItem('almma_fab_equiv')||'[]');}catch(e){}
const guardaAlias=()=>{try{localStorage.setItem('almma_fab_equiv',JSON.stringify(ALIAS_L));}catch(e){}};
const aliasIdx=(df,lf)=>ALIAS_L.findIndex(a=>a.kd===norm(df).trim()&&a.kl===norm(lf).trim());
const fabToks=s=>new Set(norm(s).split(/[^a-z0-9]+/).filter(t=>t.length>=3&&!FAB_STOP.has(t)));
// 'ok' = mismo fabricante · 'gen' = línea con fabricante genérico · 'no' = OTRO fabricante (no se puede ligar)
function fabOk(i,lf){const n=norm(lf).trim();if(FAB_GEN.includes(n))return 'gen';const df=DOCS[i].fabricante;
  if(aliasIdx(df,lf)>=0)return 'ok';const a=fabToks(df);for(const t of fabToks(lf))if(a.has(t))return 'ok';
  const ca=norm(df).replace(/[^a-z0-9]/g,''),cb=n.replace(/[^a-z0-9]/g,'');if(ca.length>=5&&cb.length>=5&&(ca.includes(cb)||cb.includes(ca)))return 'ok';
  for(const g of FAB_EQUIV){if(g.some(t=>norm(df).includes(t))&&g.some(t=>n.includes(t)))return 'ok';}return 'no';}
function marcaMismo(fab){const df=DOCS[cur].fabricante;if(aliasIdx(df,fab)<0){ALIAS_L.push({df,lf:fab,kd:norm(df).trim(),kl:norm(fab).trim()});guardaAlias();}toast('Anotado: «'+fab+'» y «'+df+'» son el mismo fabricante. Puedes deshacerlo en la línea o en la lista de la izquierda.');pinta();}
function limpiaIncompat(){ST.forEach((s,i)=>{s.grupos=s.grupos.filter(g=>g.o.every(key=>{const l=lineaPorKey(i,key);return !l||l.nueva||fabOk(i,l.fab)!=='no';}));s.sel={a:[],o:[]};});}
function desmarca(k){const a=ALIAS_L.splice(k,1)[0];guardaAlias();limpiaIncompat();pinta();toast('Equivalencia deshecha: «'+(a?a.lf:'')+'» y «'+(a?a.df:'')+'» vuelven a ser fabricantes distintos. Las líneas que dependían de ella se han desligado.');}
let ESTRICTO=true;                       // regla: una orden montada no admite mercancía (solo incidencia)
const bloq=o=>ESTRICTO&&o&&o.e==='completado';
const chipEst=o=>`<span class="chip ${o.e==='completado'?'c-hecho':o.e==='nueva'?'c-gr':'c-rev'}">${ESTADO[o.e]||o.e}</span>`;
function motivos(why){return (why||[]).map(w=>{
  if(w.startsWith('nº pedido'))return 'Número de pedido coincide: '+w.slice(10);
  if(w.startsWith('nombre'))return 'Nombre coincide: '+w.slice(7);
  if(w==='tienda')return 'Tienda compatible';
  if(w.startsWith('líneas'))return 'Líneas parecidas: '+w.slice(7);
  if(w==='fabricante')return 'Fabricante compatible';return w;});}

const ST=[];const MOVS=[];
function initDoc(i){const d=DOCS[i];ST[i]={ords:[],grupos:[],ign:[],extra:[],edit:{},xn:0,hecho:false,vals:{},sel:{a:[],o:[]},buscar:false,nueva:{tienda:'',cliente:d.cliente_final||'',pedido:'',tipo:'orden',origen:''}};
  if((d.cls==='casa solo'||d.cls==='revisar')&&d.top.length){const o=ORDM[d.top[0].id];if(!bloq(o)){ST[i].ords=[o.i];ST[i].grupos=autoGrupos(i);}}}
function ordenObj(id,i){ if(id==='NUEVA'){const n=ST[i].nueva;return {i:'NUEVA',t:n.tienda||'(elegir tienda)',c:n.cliente,p:n.pedido,e:'nueva',l:(DOCS[i].lineas||[]).map(l=>[l.desc,l.cant||1,'',DOCS[i].fabricante])};} return ORDM[id]; }
function olines(o,i){const ed=ST[i].edit||{};const nu=o.i==='NUEVA';
  const base=(o.l||[]).map((l,k)=>{const key=o.i+'#'+k,e=ed[key]||{};return {key,desc:e.desc!=null?e.desc:l[0],cant:e.cant!=null?e.cant:l[1],rec:l[2],fab:l[3],nueva:nu};});
  (ST[i].extra||[]).filter(e=>e.oid===o.i).forEach(e=>{const x=ed[e.key]||{};base.push({key:e.key,desc:x.desc!=null?x.desc:e.desc,cant:x.cant!=null?x.cant:e.cant,rec:'',fab:e.fab,nueva:true});});return base;}
function lineaPorKey(i,key){const oid=key.split('#')[0];const o=ordenObj(oid,i);return o?olines(o,i).find(l=>l.key===key):null;}
function autoGrupos(i){
  const d=DOCS[i],s=ST[i];const ls=[];s.ords.forEach(id=>olines(ordenObj(id,i),i).forEach(l=>ls.push(l)));
  ls.splice(0,ls.length,...ls.filter(l=>l.nueva||fabOk(i,l.fab)!=='no'));
  const gs=[]; if(!ls.length||!(d.lineas||[]).length)return gs;
  if(ls.length===1){const ot=toks(ls[0].desc);const ov=d.lineas.map((l,k)=>[...toks(l.desc)].some(x=>ot.has(x))?k:-1).filter(k=>k>=0);
    gs.push({a:ov.length?ov:d.lineas.map((_,k)=>k),o:[ls[0].key],b:null,p:null});return gs;}
  const m={};d.lineas.forEach((l,k)=>{const t=toks(l.desc);let best=null,bs=0;ls.forEach(o=>{const ot=toks(o.desc);let n=0;t.forEach(x=>{if(ot.has(x))n++;});if(n>bs){bs=n;best=o.key;}});if(best){(m[best]=m[best]||[]).push(k);}});
  Object.entries(m).forEach(([key,a])=>gs.push({a,o:[key],b:null,p:null}));return gs;}
let cur=0;
const val=(i,k)=>{const v=ST[i].vals[k];return v!==undefined?v:DOCS[i][k];};
const dudoso=(i,k)=>{if(k==='bultos_mano')return false;if(ST[i].vals[k]!==undefined)return false;const v=DOCS[i][k];return v==null||v===''||String(v).includes('?');};
function bultosEf(i){const m=val(i,'bultos_mano'),a=val(i,'bultos_impresos');
  if(m!=null&&m!==''&&Number(m)>0)return {n:Number(m),src:'mano'};
  if(a!=null&&a!==''&&Number(a)>0)return {n:Number(a),src:'albaran'};return {n:0,src:'orden'};}
function estado(i){const s=ST[i],d=DOCS[i];if(s.descartada)return ['Descartado','c-hecho'];if(s.hecho)return ['Hecho','c-hecho'];
  if(!s.ords.length){const t=d.top.length&&bloq(ORDM[d.top[0].id]);return t?['Orden montada','c-rev']:(d.cls==='dudoso'?CLS['dudoso']:d.cls==='sin orden'?CLS['sin orden']:CLS['revisar']);}
  if(d.cls==='dudoso'||d.cls==='sin orden')return CLS['revisar'];return CLS[d.cls];}
const gDe=(i,t,x)=>ST[i].grupos.findIndex(g=>g[t].includes(x));

function pintaLista(){
  const act=DOCS.filter((d,i)=>!ST[i].hecho).length;
  let h='<h3>Albaranes por confirmar ('+act+')</h3><div class="resumen">Sube fotos arriba a la derecha. Los ya confirmados salen en gris.</div>';
  DOCS.forEach((d,i)=>{const [t,c]=estado(i);
    h+=`<button class="doc ${i==cur?'act':''}" onclick="ir(${i})"><div class="n">${esc((d.fabricante||'¿?').slice(0,34))}</div><div class="s">${esc(String(d.num_albaran||'—').slice(0,22))} · ${esc(d.fecha_albaran||'')}</div><div class="s">${esc(d.nota||'')}</div><div style="margin-top:4px"><span class="chip ${c}">${t}</span></div></button>`;});
  if(ALIAS_L.length)h+=`<div class="resumen" style="border-top:1px solid var(--border)"><b>Equivalencias de fabricante anotadas (${ALIAS_L.length})</b>${ALIAS_L.map((a,k)=>`<div style="margin-top:6px;font-size:12px">«${esc(a.lf)}» = «${esc(a.df.slice(0,24))}» <button class="sec2 peq" onclick="desmarca(${k})">↩ Deshacer</button></div>`).join('')}</div>`;
  document.getElementById('lista').innerHTML=h;}
function ir(i){cur=i;ST[i].sel={a:[],o:[]};pinta();document.getElementById('pbody').scrollTop=0;}
function pintaVisor(){
  const d=DOCS[cur],s=ST[cur];const ords=s.ords.filter(x=>x!=='NUEVA').map(x=>ORDM[x]).filter(Boolean);
  const lista=[];let cargando=false;
  ords.forEach(o=>{const k=o.a+'/'+o.i;const v=DOCORD[k];if(v===undefined)docsOrden(o);if(v===undefined||v===null)cargando=true;else v.forEach(x=>lista.push(Object.assign({o:o.i},x)));});
  if(s.vdoc==null||s.vdoc>=lista.length)s.vdoc=0;
  const sel=lista[s.vdoc];let oh='',grande=false;

    const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>b?ok(b):ko(new Error("No se pudo preparar la imagen")),"image/jpeg",0.85);};
  im.onerror=()=>ko(new Error("No se puede abrir "+file.name+" (¿es HEIC o PDF? De momento solo JPG, PNG o WEBP)"));
  im.src=url;});}

  await client.from("albaranes_lecturas").update({estado:errs.length?'pendiente':'confirmada',tienda_id:o1.tid||null,num_albaran:alb,fecha_albaran:aIso(val(cur,'fecha_albaran')),fecha_recibido:iso,ubicacion:ubi,bultos_mano:Number(val(cur,'bultos_mano'))||null,bultos_impresos:Number(val(cur,'bultos_impresos'))||null,peso_kg:Number(val(cur,'peso_kg'))||null}).eq("id",d.id);
  confirmando=false;
  if(errs.length){alert('Hubo problemas:\n\n'+errs.join('\n')+'\n\nRevísalo en Entradas Almacén antes de repetir.');pinta();return;}
  s.hecho=true;toast('Entrada registrada: '+ops.length+' línea(s) marcadas como recibidas.');siguiente();
}
async function iniciar(){
  const {data:ses}=await client.auth.getSession();if(!ses.session){location.href='login.html';return;}
  const st=await client.from('staff').select('user_id').eq('user_id',ses.session.user.id).maybeSingle();
  if(!st.data){document.body.innerHTML='<p style="padding:30px">Esta pantalla es solo para personal de oficina.</p>';return;}
  document.getElementById('lista').innerHTML='<h3>Cargando…</h3>';
  try{await cargarOrdenes();await cargarPendientes();}catch(e){toast('Error al cargar: '+e.message);}
  pinta();
}

iniciar();
</script>
