// --- chat de la orden (migracion/60_chat_de_la_orden.sql) ---
async function cargarChat(anyo, orden, soy) {
  const { data } = await client.from("mensajes_orden").select("id, autor_tipo, autor_nombre, texto, creado_en").eq("anyo", anyo).eq("orden", orden).order("creado_en");
  const cont = document.getElementById("chat_lista");
  cont.innerHTML = (data || []).map(m => '<div class="msg ' + (m.autor_tipo === soy ? "mio" : "otro") + '"><div class="quien">' +
    esc(m.autor_tipo === "almma" ? "ALMMA" + (m.autor_nombre ? " · " + m.autor_nombre : "") : (m.autor_nombre || "Tienda")) + " · " + new Date(m.creado_en).toLocaleString("es-ES") +
    '</div>' + esc(m.texto) + '</div>').join("") || '<div class="muted">Aún no hay mensajes. Escribe el primero.</div>';
  cont.scrollTop = cont.scrollHeight;
  await client.rpc("marcar_chat_leido", { p_anyo: anyo, p_orden: orden });
}
async function enviarChat(anyo, orden, soy) {
  const ta = document.getElementById("chat_texto"), texto = ta.value.trim();
  if (!texto) return;
  const { error } = await client.from("mensajes_orden").insert({ anyo, orden, texto });
  if (error) { alert("No se pudo enviar: " + error.message); return; }
  ta.value = ""; await cargarChat(anyo, orden, soy);
}
let destino = "mis-pedidos.html";
function volver(){ location.href = destino; }
(async () => {
  const p = new URLSearchParams(location.search), anyo = +p.get("anyo"), orden = +p.get("orden");
  const { data:{ user } } = await client.auth.getUser();
  if (!user) { location.href = "login.html"; return; }

  if (!dep) { location.href = "login.html"; return; }
  await exigirCondiciones(client);
  if (dep.es_admin_tienda) destino = "tienda.html";
  const { data: o, error } = await client.from("ordenes").select("anyo, orden, nombre_cli, domicilio_cli, localidad_cli, telefono_cli, telefono2_cli, num_pedido, estado, fecha_creacion, fecha_prev_recepcion, fecha_recepcion, fecha_prev_montaje, horamont, fecha_montaje, con_incidencia, dependiente_id, tiendas(nombre)").eq("anyo", anyo).eq("orden", orden).maybeSingle();
  if (error || !o) { document.getElementById("cont").innerHTML = '<span class="muted">No se encuentra esa orden o no tienes acceso a ella.</span>'; return; }
  document.getElementById("titulo").textContent = "Orden " + o.anyo + "/" + o.orden;
  const [li, ci] = await Promise.all([
    client.from("linorden").select("linea, tipolinea, articulo, descripcion, cantidad, recibido, ubicacion").neq("tipolinea", 4).eq("anyo", anyo).eq("orden", orden).order("linea"),
    client.from("citas_montaje").select("fecha_hora, estado").eq("anyo", anyo).eq("orden", orden).neq("estado", "cancelada").order("fecha_hora")
  ]);
  const vend = ((await client.rpc("nombres_vendedores")).data || []).find(v => v.id === o.dependiente_id);
  const k = (a,b) => '<div><div class="k">'+a+'</div><div class="v">'+(b || "—")+'</div></div>';
  const lineas = (li.data || []).filter(l => l.tipolinea !== 4);
  document.getElementById("cont").innerHTML =
    '<div class="card"><div style="margin-bottom:10px"><span class="est">'+esc(o.estado === "completado" && o.con_incidencia ? "completado con incidencias" : (o.estado||"").replace(/_/g," "))+'</span></div><div class="grid">'+
      k("Cliente", esc(o.nombre_cli))+k("Dirección", esc([o.domicilio_cli, o.localidad_cli].filter(Boolean).join(" - ")))+
      k("Teléfono", esc([o.telefono_cli, o.telefono2_cli].filter(Boolean).join(" / ")))+k("Referencia de pedido", esc(o.num_pedido))+k("Vendedor", esc(vend && vend.nombre))+
      k("Creada", f(o.fecha_creacion))+k("Recepción prevista", f(o.fecha_prev_recepcion))+k("Recibida en almacén", f(o.fecha_recepcion))+
      k("Montaje previsto", f(o.fecha_prev_montaje) + (o.horamont ? " · " + esc(o.horamont) : ""))+k("Montaje realizado", f(o.fecha_montaje))+
    '</div></div>'+

    '<div class="card"><b>Chat con ALMMA</b><div class="muted" style="margin:4px 0 10px">Escribe aquí comentarios sobre esta orden; el personal de ALMMA te responderá.</div><div class="chat" id="chat_lista"></div>'+
    '<div class="chat-form"><textarea id="chat_texto" maxlength="2000" placeholder="Escribe un mensaje..."></textarea><button id="chat_enviar">Enviar</button></div></div>';
  document.getElementById("chat_enviar").onclick = () => enviarChat(anyo, orden, "tienda");
  await cargarChat(anyo, orden, "tienda");
  document.getElementById("docs_subir").onclick = () => subirDocumentos(anyo, orden);
  await cargarDocumentos(anyo, orden);
  // fotos y firma del montaje (solo lectura)
  try {
    const [fo, en] = await Promise.all([
      client.from("fotos_orden").select("storage_path, comentario, created_at").eq("anyo", anyo).eq("orden", orden).order("created_at"),
      client.from("entregas").select("firmante_nombre, firmado_at, firma_storage_path").eq("anyo", anyo).eq("orden", orden)
    ]);
    const rutas = [...(fo.data || []).map(x => x.storage_path), ...(en.data || []).map(x => x.firma_storage_path)].filter(Boolean);
    const urls = {};
    if (rutas.length) { const { data } = await client.storage.from("ordenes-adjuntos").createSignedUrls(rutas, 3600); (data || []).forEach(d => urls[d.path] = d.signedUrl); }
    const img = (r, t) => urls[r] ? '<a href="'+urls[r]+'" target="_blank"><div style="display:inline-block;width:120px;margin:0 8px 8px 0;vertical-align:top"><img src="'+urls[r]+'" style="width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid #cbd5e1">'+(t ? '<div style="font-size:11px">'+esc(t)+'</div>' : "")+'</div></a>' : "";
    const firmas = (en.data || []).map(x => '<div style="margin-bottom:8px">Firmado por <b>'+esc(x.firmante_nombre)+'</b> · '+(x.firmado_at ? new Date(x.firmado_at).toLocaleString("es-ES") : "")+'<br>'+img(x.firma_storage_path)+'</div>').join("");
    const fotos = (fo.data || []).map(x => img(x.storage_path, x.comentario)).join("");

})();

// --- documentos de la orden (migracion/64 y 65: la tienda puede ver y subir PDF o foto a sus órdenes) ---
async function cargarDocumentos(anyo, orden) {
  const { data } = await client.from("documentos_orden").select("storage_path, nombre, created_at").eq("anyo", anyo).eq("orden", orden).order("created_at", { ascending: false });
  const cont = document.getElementById("docs_lista");
  cont.innerHTML = (data || []).map(d =>
    '<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:10px">'+
      '<div class="miniatura" data-ruta="'+esc(d.storage_path)+'" style="width:90px;height:120px;flex:none;border:1px solid var(--border);border-radius:6px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:11px;color:var(--muted)">…</div>'+
      '<div><b>'+esc(d.nombre || "documento")+'</b><div class="muted">'+new Date(d.created_at).toLocaleString("es-ES")+'</div></div></div>'
  ).join("") || '<div class="muted">Sin documentos.</div>';
  cont.querySelectorAll(".miniatura").forEach(el => { el.onclick = () => abrirDocumento(el.dataset.ruta); pintarMiniatura(el); });
}
async function abrirDocumento(ruta) {
  const { data, error } = await client.storage.from("ordenes-adjuntos").createSignedUrl(ruta, 300);
  if (error) { alert("No se pudo abrir: " + error.message); return; }
  window.open(data.signedUrl, "_blank");
}
async function pintarMiniatura(el) {
  const ruta = el.dataset.ruta;
  try {
    const { data, error } = await client.storage.from("ordenes-adjuntos").createSignedUrl(ruta, 300);
    if (error) throw error;
    if (/\.pdf$/i.test(ruta)) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      const pag = await (await pdfjsLib.getDocument(data.signedUrl).promise).getPage(1);
      const vp = pag.getViewport({ scale: 240 / pag.getViewport({ scale: 1 }).width });
      const lienzo = document.createElement("canvas");
      lienzo.width = vp.width; lienzo.height = vp.height; lienzo.style.cssText = "width:100%;height:auto;";
      await pag.render({ canvasContext: lienzo.getContext("2d"), viewport: vp }).promise;
      el.textContent = ""; el.appendChild(lienzo);
    } else el.innerHTML = '<img src="'+data.signedUrl+'" alt="" style="width:100%;height:100%;object-fit:cover">';
  } catch (_) { el.textContent = /\.pdf$/i.test(ruta) ? "PDF" : "foto"; }
}
// un PDF se sube tal cual (máx. 5 MB); una foto se reduce a 2000 px y se pasa a JPG
async function prepararArchivo(file) {
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    if (file.size > 5 * 1024 * 1024) throw new Error("El PDF pesa más de 5 MB.");
    return file;
  }
  if (!file.type.startsWith("image/")) throw new Error("Solo se pueden subir PDF o fotos.");
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (_) { throw new Error("No se pudo abrir la foto. Si es de iPhone (HEIC), guárdala como JPG."); }
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const lienzo = document.createElement("canvas");
  lienzo.width = Math.round(bmp.width * k); lienzo.height = Math.round(bmp.height * k);
  lienzo.getContext("2d").drawImage(bmp, 0, 0, lienzo.width, lienzo.height);
  const blob = await new Promise(ok => lienzo.toBlob(ok, "image/jpeg", 0.85));
  if (!blob) throw new Error("No se pudo preparar la foto.");
  return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
}
function nombreSeguroArchivo(file) {
  const base = file.name.replace(/\.(pdf|jpe?g|png|webp|gif)$/i, "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^A-Za-z0-9._-]+/g, "_").slice(0, 60) || "documento";
  return base + (file.type === "application/pdf" ? ".pdf" : ".jpg");
}
async function subirDocumentos(anyo, orden) {
  const input = document.getElementById("docs_archivo"), btn = document.getElementById("docs_subir");
  const originales = [...input.files];
  if (!originales.length) { alert("Elige uno o varios PDF o fotos primero."); return; }
  btn.disabled = true; btn.textContent = "Subiendo...";
  const fallos = [];
  for (const [n, original] of originales.entries()) {
    try {
      const archivo = await prepararArchivo(original);
      const ruta = anyo + "/" + orden + "/documentos/" + Date.now() + "_" + n + "_" + nombreSeguroArchivo(archivo);
      const { error: e1 } = await client.storage.from("ordenes-adjuntos").upload(ruta, archivo, { contentType: archivo.type });
      if (e1) throw new Error(e1.message);
      const { error: e2 } = await client.from("documentos_orden").insert({ anyo, orden, storage_path: ruta, nombre: original.name });
      if (e2) throw new Error(e2.message);
    } catch (e) { fallos.push(original.name + ": " + e.message); }
  }
  btn.disabled = false; btn.textContent = "Adjuntar"; input.value = "";
  if (fallos.length) alert("No se pudieron subir:\n" + fallos.join("\n"));
  await cargarDocumentos(anyo, orden);
}

(function () {
  const enStaff = location.pathname.endsWith("pedidos.html");

  async function pintarBanner() {
    const { data, error } = await client.rpc("ordenes_con_chat_sin_leer");
    let b = document.getElementById("banner_mensajes");
    if (error || !data || !data.length) { if (b) b.remove(); return; }
    if (!b) {
      b = document.createElement("div"); b.id = "banner_mensajes";
      b.style.cssText = "position:sticky;top:0;z-index:9999;background:#dc2626;color:#fff;padding:9px 16px;font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;text-align:center";
      document.body.prepend(b);
    }
    const orden = data.slice().sort((x, y) => y.anyo - x.anyo || y.orden - x.orden);
    b.innerHTML = "💬 MENSAJES SIN LEER (" + orden.length + (orden.length === 1 ? " orden" : " órdenes") + "): " +
      orden.slice(0, 8).map(r => '<a style="color:#fff;text-decoration:underline;margin:0 6px" href="' + enlace(r.anyo, r.orden) + '">' + r.anyo + "/" + r.orden + "</a>").join("") +
      (orden.length > 8 ? " y " + (orden.length - 8) + " más" : "");
  }
  pintarBanner(); setInterval(pintarBanner, 60000);
})();
